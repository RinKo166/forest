<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOREST</title>
<style>
/* 手机强制横屏提示 */
@media (orientation: portrait) and (max-width: 768px) {
  #rotateTip { display: flex !important; }
  .container { display: none !important; }
}
</style>
<style>
:root {
  --cell-size: 50px;
  --double-cell: calc(var(--cell-size) * 2);
  --container-cols: 11;
  --container-rows: 21;
  --container-width: calc(var(--cell-size) * var(--container-cols));
  --container-height: calc(var(--cell-size) * var(--container-rows));
}
@media (max-width: 1199px) { :root { --cell-size: 40px; } }
@media (max-width: 767px) { :root { --cell-size: 30px; } }
@media (max-width: 479px) { :root { --cell-size: 25px; } }
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
body {
  background: #1a1a1a;
  color: #e0e0e0;
  font-family: 'Segoe UI', sans-serif;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  padding: 0;
}
.container {
  max-width: 100%;
  width: 100%;
  height: 100vh;
  background: #222;
  display: flex; flex-direction: column;
}
.top-bar {
  display: flex; align-items: center; gap: 20px;
  padding: 10px 16px;
  border-bottom: 1px solid #3a3a3a;
  flex-shrink: 0;
}
.top-bar h1 { font-size: 20px; color: #e94560; flex-shrink: 0; margin: 0; }

/* 导航 */
.nav-bar { display: flex; gap: 2px; flex-wrap: wrap; flex: 1; }
.nav-btn {
  padding: 6px 14px; background: transparent; border: none; color: #666;
  cursor: pointer; font-size: 13px; font-weight: bold;
  ;
}
.nav-btn:hover { color: #aaa; }
.nav-btn.active { color: #e94560; border-bottom-color: #e94560; }
.nav-btn.disabled { color: #444 !important; cursor: default !important; border-bottom-color: transparent !important; }
.nav-btn.disabled:hover { color: #444 !important; }
.sub-tab-bar { display:flex; gap:4px; margin-bottom:8px; flex-wrap:wrap; }
.sub-tab { width:var(--double-cell); height:var(--double-cell); padding:0; background:transparent; border:2px solid #444; ; cursor:pointer; position:relative; overflow:hidden; }
.sub-tab:hover { border-color:#888; background:rgba(255,255,255,0.05); }
.sub-tab.active { border-color:#e94560; background:rgba(233,69,96,0.1); }
.battle-log {
  background: #111; border: 1px solid #333; ;
  padding: 12px; min-height: 60px; overflow-y: auto;
  font-size: 13px; line-height: 1.6; white-space: pre-wrap;
  max-height: 50vh;
}

/* 界面容器 */
.content-area {
  flex: 1; overflow: hidden; border: 1px solid #3a3a3a; border-width: 0 1px 1px 1px;
}
.screen { display: none; height:100%; overflow-y:auto; padding: 16px; }
.screen.active { display: block; }

/* 装备界面 */
.equip-layout { display: flex; gap: 16px; flex-wrap: wrap; }

.stats-box {
  flex: none;
  background: #252525; ; padding: 14px;
  border: 1px solid #3a3a3a;
}
.stats-box .st { display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; border-bottom: 1px solid #222; }
.stats-box .st:last-child { border-bottom: none; }
.stats-box .v { font-weight: bold; color: #fff; }

.body-model {
  display: grid;
  grid-template-columns: var(--double-cell) var(--double-cell) var(--double-cell);
  gap: 3px;
  text-align: center;
  justify-content: center;
}
.body-part {
  cursor: default;
  transition: background 0.2s;
  width: var(--double-cell); height: var(--double-cell);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
.body-part .bp-name { color: rgba(255,255,255,0.8); font-size: 11px; }
.body-part .bp-hp { color: #fff; font-weight: bold; font-size: 14px; }
.equip-box { flex: none; display: flex; flex-direction: column; align-items: center; background:#252525; border:1px solid #3a3a3a; ; padding:14px; }
.equip-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr 1fr;
  grid-template-rows: auto auto auto auto;
  gap: 5px;
}
.equip-slot {
  background: #252525; border: 2px solid #3a3a3a;
  padding: 6px; text-align: center;
  width: var(--double-cell); height: var(--double-cell);
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  cursor: pointer; font-size: 12px;
}
.equip-slot:hover { border-color: #e94560; }
.equip-slot.empty { border-style: solid; opacity: 0.5; }
.equip-slot .sl { font-size: 10px; color: #666; }
.equip-slot .nm { font-weight: bold; color: #fff; font-size: 12px; }
.equip-slot .ex { font-size: 10px; color: #aaa; }
.equip-slot.drag-equip-valid { border-color: #4ecca3; }

/* .s-* grid positions generated from SLOT_DEFS at init */

.ws-row { display:none; gap:5px; margin-top:5px; justify-content:center; flex-wrap:wrap; width:100%; }
.ws-row .equip-slot { width:var(--double-cell); height:var(--double-cell); }

.inv-box { flex: 1.5; min-width: 170px; background: #252525; ; padding: 14px; border: 1px solid #3a3a3a; }
.inv-box h2 { font-size: 14px; color: #888; margin-bottom: 8px; text-align: center; }
.stash-panel { background: #252525; ; padding: 14px; border: 1px solid #3a3a3a; }
.inv-grid { display: grid; grid-template-columns: 1fr; gap: 0; }
[data-drop="buybox"].drag-over { outline: 1px solid #4ecca3 !important; outline-offset: -1px; background: #1a3a2e !important; }
.inv-item {
  background: #222; border: 1px solid #333; ;
  padding: 6px; text-align: center; cursor: pointer; font-size: 11px;
}
/* .grid-item hover removed */
.inv-item .in { font-weight: bold; color: #fff; }
.inv-item .is { color: #888; font-size: 10px; }
.inv-empty { grid-column: 1/-1; text-align: center; color: #555; padding: 20px; }
.inv-cell { width:var(--cell-size); height:var(--cell-size); box-sizing:border-box; background:#2a2a2a; }
[data-drop="bag"].grid-item { ; border:none; min-width:0; padding:0; text-align:left; box-sizing:border-box; position:relative; z-index:0; }
[data-drop^="bag"] { background:#2a2a2a; position:relative; }
.l1 { display:block; }
.l2 { display:block; }
.l3 { z-index:0; } .l4 { z-index:1; } .l5 { z-index:2; }
.l3 { z-index:0; } .l4 { z-index:1; } .l5 { z-index:2; }
.l7 { display:flex; }
.l8 { display:block; }
.l9 { display:block; }
.l10 { display:block; }
.l11 { display:block; }
.inv-cell.inv-blocked { cursor:default; }
.inv-cell.drag-over, [data-drop="bag"].grid-item.drag-over { background:rgba(26,58,46,0.7) !important; outline:none !important; z-index:2; }
.inv-cell.drag-over, [data-drop="bag"].grid-item.drag-over { background:rgba(26,58,46,0.7) !important; outline:none !important; z-index:2; }
.inv-cell.drag-invalid, [data-drop="bag"].grid-item.drag-invalid { background:rgba(58,26,26,0.7) !important; outline:none !important; z-index:2; }
.inv-cell.drag-invalid, [data-drop="bag"].grid-item.drag-invalid { background:rgba(58,26,26,0.7) !important; outline:none !important; z-index:2; }
[data-overlay-for].drag-over { background: rgba(26,58,46,0.7) !important; outline: none !important; z-index: 2; }
[data-overlay-for].drag-over { background: rgba(26,58,46,0.7) !important; outline: none !important; z-index: 2; }
[data-overlay-for].drag-invalid { background: rgba(58,26,26,0.7) !important; outline: none !important; z-index: 2; }
[data-overlay-for].drag-invalid { background: rgba(58,26,26,0.7) !important; outline: none !important; z-index: 2; }
.equip-slot.drag-over { border-color: #4ecca3 !important; background: #1a3a2e !important; }
.equip-slot.drag-over { border-color: #4ecca3 !important; background: #1a3a2e !important; }
.equip-slot.drag-invalid { border-color: #e94560 !important; background: #3a1a1a !important; }
.body-part.drag-over { outline: 2px solid #4ecca3 !important; outline-offset: -1px; background: #1a3a2e !important; }
.body-part.drag-invalid { outline: 2px solid #e94560 !important; outline-offset: -1px; background: #3a1a1a !important; }
[data-txt] {  }
.inv-item-name-wrap { overflow: hidden; width: 100%; white-space: nowrap; text-overflow: ellipsis; text-align: left; }

/* 弹窗 */
.btn-pri { background:#3a5a4a; color:#e0e0e0; } .btn-pri:hover { background:#4a7a5a; } .btn-pri:active { background:#2a4a3a; }
.btn-suc { background:#2a4a3a; color:#e0e0e0; } .btn-suc:hover { background:#3a6a4a; } .btn-suc:active { background:#1a3a2a; }
.btn-del { background:#3a2a2a; color:#e06060; } .btn-del:hover { background:#5a3a3a; } .btn-del:active { background:#2a1a1a; }
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  z-index: 1000;
  pointer-events: none;
}
.modal-box {
  background: #252525; border: 2px solid #3a3a3a; ;
  padding: 18px; min-width: 260px; pointer-events: auto;
  
}
.modal-box .sub {
  font-size: 13px; color: #aaa; margin-bottom: 12px; line-height: 1.5;
}
.modal-header {
  display: flex; justify-content: space-between; align-items: center;
  position: sticky; top: 0; z-index: 1;
  background: #252525; padding-bottom: 8px; margin-bottom: 8px;
}
.mbtn {
  display: block; width: 100%; padding: 10px; margin-bottom: 6px;
  border: 1px solid #fff; ; background: #222; color: #fff;
  font-size: 13px; cursor: pointer; font-family: inherit;
}
.mbtn:hover { border-color: #4ecca3; background: #353535; }
.mbtn:last-child { margin-bottom: 0; }
.mbtn-del { border-color: #e94560; color: #e94560; }

@media (max-width: 700px) {
  .equip-layout { flex-direction: column; }
  .equip-grid { grid-template-columns: 1fr 1fr 1fr 1fr; }
  .equip-slot { min-height: 48px; }
}
</style>
<body>
<div id="rotateTip" style="display:none;position:fixed;inset:0;z-index:99999;background:#1a1a1a;color:#888;flex-direction:column;align-items:center;justify-content:center;font-size:18px;gap:12px;">
  <div style="font-size:48px;">↻</div>
  <div>请横屏使用</div>
</div>
<div class="container">
  <div class="top-bar">
    <h1>FOREST</h1>
    <div class="nav-bar">
      <button class="nav-btn active" id="navDungeon" onclick="showScreen('dungeon')">远征</button>
      <button class="nav-btn" id="navEquip" onclick="showScreen('equip')">角色</button>
      <button class="nav-btn" id="navCamp" onclick="showScreen('camp')">营地</button>
      <button class="nav-btn" id="navSkill" onclick="showScreen('skill')">技能</button>
      <button class="nav-btn" id="navTrader" onclick="showScreen('trader')">商人</button>
      <button class="nav-btn" id="navStats" onclick="showScreen('stats')">航海日志</button>
      <button class="nav-btn" id="navSave" onclick="showScreen('save')">存档</button>
    </div>
  </div>
  <div class="content-area">

  <!-- 远征界面 -->
  <div class="screen active" id="screenDungeon">
    <div id="mapSelect" style="text-align:center;padding:10px;">
      <div style="font-size:16px;color:#e94560;font-weight:bold;margin-bottom:12px;">选择地图</div>
      <div id="mapList"></div>
    </div>
    <div id="expeditionView" style="display:none;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
        <span class="title" id="dTitle" style="font-size:16px;">远征</span>
        <span style="font-size:14px;">行动时间：<span id="actionTimeDisplay" style="color:#4ecca3;font-weight:bold;">100</span></span>
      </div>
      <!-- 上排：地图左 + 事件右 -->
      <div style="display:flex;gap:10px;min-height:0;">
        <div style="flex:1;min-width:0;">
          <div style="text-align:left;font-size:11px;color:#888;margin-bottom:4px;" id="coordDisplay">当前位置：A1</div>
          <div id="roomGrid" style="overflow:auto;max-height:60vh;"></div>
        </div>
        <div style="width:260px;flex-shrink:0;display:flex;flex-direction:column;">
          <div class="desc" id="dDesc" style="margin-bottom:6px;"></div>
          <div class="battle-log" id="dLog" style="flex:1;"></div>
          <div class="choices" id="dChoices" style="margin-top:6px;"></div>
        </div>
      </div>
      <!-- 远征页装备同步 -->
      <div style="border-top:2px solid #3a3a3a;margin-top:12px;padding-top:10px;">
        <div style="font-size:14px;color:#888;text-align:center;margin-bottom:10px;">── 装备 ──</div>
        <div class="equip-layout">
          <div class="stats-box">
            <div class="body-model" id="exBodyModel"></div>
          </div>
          <div class="equip-box">
            <div class="equip-grid">
              <div class="equip-slot s-head empty" data-drop="equip" data-slot="head" onclick="showEquipModal('head')"><span class="sl">头</span><span class="nm" id="exEqHead">空</span></div>
              <div class="equip-slot s-sling empty" data-drop="equip" data-slot="sling" onclick="showEquipModal('sling')"><span class="sl">背带</span><span class="nm" id="exEqSling">空</span></div>
              <div class="equip-slot s-mask empty" data-drop="equip" data-slot="mask" onclick="showEquipModal('mask')"><span class="sl">面具</span><span class="nm" id="exEqMask">空</span></div>
              <div class="equip-slot s-arms empty" data-drop="equip" data-slot="arms" onclick="showEquipModal('arms')"><span class="sl">手臂</span><span class="nm" id="exEqArms">空</span></div>
              <div class="equip-slot s-safe empty" data-drop="equip" data-slot="safe" onclick="showEquipModal('safe')"><span class="sl">保险箱</span><span class="nm" id="exEqSafe">空</span></div>
              <div class="equip-slot s-chest empty" data-drop="equip" data-slot="chest" onclick="showEquipModal('chest')"><span class="sl">胸</span><span class="nm" id="exEqChest">空</span></div>
              <div class="equip-slot s-clothes empty" data-drop="equip" data-slot="clothes" onclick="showEquipModal('clothes')"><span class="sl">衣服</span><span class="nm" id="exEqClothes">空</span></div>
              <div class="equip-slot s-legs empty" data-drop="equip" data-slot="legs" onclick="showEquipModal('legs')"><span class="sl">腿</span><span class="nm" id="exEqLegs">空</span></div>
              <div class="equip-slot s-pants empty" data-drop="equip" data-slot="pants" onclick="showEquipModal('pants')"><span class="sl">裤子</span><span class="nm" id="exEqPants">空</span></div>
              <div class="equip-slot s-pack empty" data-drop="equip" data-slot="pack" onclick="showEquipModal('pack')"><span class="sl">背包</span><span class="nm" id="exEqPack">空</span></div>
              <div class="equip-slot s-chest-pack empty" data-drop="equip" data-slot="chest_pack" onclick="showEquipModal('chest_pack')"><span class="sl">胸包</span><span class="nm" id="exEqChestPack">空</span></div>
              <div class="equip-slot s-waist-pouch empty" data-drop="equip" data-slot="waist_pouch" onclick="showEquipModal('waist_pouch')"><span class="sl">腰包</span><span class="nm" id="exEqWaistPouch">空</span></div>
            </div>
            <div class="ws-row" id="exWeaponSlotsRow"></div>
            <div class="ws-row" id="exSidearmSlotsRow"></div>
            <div class="actions">
              <button class="btn btn-pri" onclick="showItemOverview()">物品总览</button>
              <button class="btn btn-sec" onclick="damageAllLimbs(10)" style="margin-left:6px;">测试伤害</button>
            </div>
            <div class="msg info" id="exEquipMsg"></div>
          </div>
          <div class="inv-box">
            <div class="inv-grid" id="exInvGrid"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 营地界面 -->
  <div class="screen" id="screenEquip">
    <div style="display:flex;gap:16px;min-height:0;align-items:flex-start;">
      <div style="display:flex;flex-direction:column;gap:12px;">
        <div class="stats-box" style="flex:none;">
          <div class="body-model" id="bodyModel"></div>
        </div>
        <div class="equip-box" style="flex:none;">
          <div class="equip-grid">
            <div class="equip-slot s-head empty" data-drop="equip" data-slot="head" onclick="showEquipModal('head')"><span class="sl">头</span><span class="nm" id="eqHead">空</span></div>
            <div class="equip-slot s-sling empty" data-drop="equip" data-slot="sling" onclick="showEquipModal('sling')"><span class="sl">背带</span><span class="nm" id="eqSling">空</span></div>
            <div class="equip-slot s-mask empty" data-drop="equip" data-slot="mask" onclick="showEquipModal('mask')"><span class="sl">面具</span><span class="nm" id="eqMask">空</span></div>
            <div class="equip-slot s-arms empty" data-drop="equip" data-slot="arms" onclick="showEquipModal('arms')"><span class="sl">手臂</span><span class="nm" id="eqArms">空</span></div>
            <div class="equip-slot s-safe empty" data-drop="equip" data-slot="safe" onclick="showEquipModal('safe')"><span class="sl">保险箱</span><span class="nm" id="eqSafe">空</span></div>
            <div class="equip-slot s-chest empty" data-drop="equip" data-slot="chest" onclick="showEquipModal('chest')"><span class="sl">胸</span><span class="nm" id="eqChest">空</span></div>
            <div class="equip-slot s-clothes empty" data-drop="equip" data-slot="clothes" onclick="showEquipModal('clothes')"><span class="sl">衣服</span><span class="nm" id="eqClothes">空</span></div>
            <div class="equip-slot s-legs empty" data-drop="equip" data-slot="legs" onclick="showEquipModal('legs')"><span class="sl">腿</span><span class="nm" id="eqLegs">空</span></div>
            <div class="equip-slot s-pants empty" data-drop="equip" data-slot="pants" onclick="showEquipModal('pants')"><span class="sl">裤子</span><span class="nm" id="eqPants">空</span></div>
            <div class="equip-slot s-pack empty" data-drop="equip" data-slot="pack" onclick="showEquipModal('pack')"><span class="sl">背包</span><span class="nm" id="eqPack">空</span></div>
            <div class="equip-slot s-chest-pack empty" data-drop="equip" data-slot="chest_pack" onclick="showEquipModal('chest_pack')"><span class="sl">胸包</span><span class="nm" id="eqChestPack">空</span></div>
            <div class="equip-slot s-waist-pouch empty" data-drop="equip" data-slot="waist_pouch" onclick="showEquipModal('waist_pouch')"><span class="sl">腰包</span><span class="nm" id="eqWaistPouch">空</span></div>
          </div>
          <div class="ws-row" id="weaponSlotsRow"></div>
          <div class="ws-row" id="sidearmSlotsRow"></div>
          <div class="actions">
            <button class="btn btn-pri" onclick="showItemOverview()">物品总览</button>
            <button class="btn btn-sec" onclick="damageAllLimbs(10)" style="margin-left:6px;">测试伤害</button>
          </div>
          <div class="msg info" id="equipMsg"></div>
        </div>
      </div>
      <div class="inv-box" style="width:var(--container-width);height:var(--container-height);flex:none;overflow-y:auto;">
        <div class="inv-grid" id="invGrid"></div>
      </div>
      <div class="stash-panel" style="width:var(--container-width);height:var(--container-height);flex:none;overflow-y:auto;">
        <div class="inv-grid" id="stashGrid" style="grid-template-columns:repeat(10,var(--cell-size));gap:0;;"></div>
              </div>
    </div>
  </div>
  <!-- 统计界面 -->
  <div class="screen" id="screenStats">
    <div class="stats-box-big">
      <div class="l">航海日志</div>
      <div class="d">
        <div>最深远征：第 <span id="stFloor" style="color:#fff;">1</span> 次</div>
        <div>击退敌人：<span id="stKills" style="color:#fff;">0</span></div>
        <div>累计掠夺：<span id="stGoldAll" style="color:#fff;">0</span></div>
        <div>阵亡次数：<span id="stDeaths" style="color:#e94560;">0</span></div>
      </div>
      <div style="margin-top:20px;text-align:left;">
        <div class="l" style="font-size:14px;">敌人图鉴</div>
        <div id="bestiaryList" style="margin-top:8px;"></div>
      </div>
    </div>
  </div>

  <!-- 营地界面 -->
  <div class="screen" id="screenCamp">
    <div style="padding:16px;">
      <div class="l" style="margin-bottom:8px;">营地设施</div>
      <div class="equip-slot s-stash empty" id="campStashSlot" data-drop="equip" data-slot="camp_stash" onclick="showEquipModal('camp_stash')" style="width:var(--double-cell,100px);height:var(--double-cell,100px);">
        <span class="sl">设施</span>
        <span class="nm" id="eqCampStash">空</span>
      </div>
    </div>
  </div>

  <!-- 技能界面 -->
  <div class="screen" id="screenSkill">
    <div class="stats-box-big">
      <div class="l">技能</div>
      <div class="d" id="skillList">
        <div style="color:#666;font-size:13px;">暂无技能</div>
      </div>
    </div>
  </div>

  <!-- 商人界面 -->
  <div class="screen" id="screenTrader">
    <div style="padding:10px;">
      <div style="display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap;" id="merchantTabBar"></div>
      <div style="display:flex;gap:12px;justify-content:flex-start;">
        <!-- 左：商人货物网格 -->

<script>
// 网格尺寸常量（响应式）
var CELL_SIZE = 50, HALF_CELL = 25;
function getCellSize() {
  var w = window.innerWidth;
  if (w >= 1200) return 50;
  if (w >= 768) return 40;
  if (w >= 480) return 30;
  return 25;
}
function syncCellSize() {
  var s = getCellSize();
  if (s === CELL_SIZE) return;
  CELL_SIZE = s;
  HALF_CELL = s / 2;
  document.documentElement.style.setProperty('--cell-size', s + 'px');
  renderAll();
}

// 游戏数据
const G = {
  floor: 1, kills: 0, totalGold: 0, deaths: 0,
  hp: 100, maxHp: 100,
  baseAtk: 5, baseDef: 3, baseSpd: 5,
  limbs: {
    head: { hp: 50, max: 50 },
    chest: { hp: 70, max: 70 },
    abdomen: { hp: 70, max: 70 },
    leftHand: { hp: 50, max: 50 },
    rightHand: { hp: 50, max: 50 },
    leftLeg: { hp: 50, max: 50 },
    rightLeg: { hp: 50, max: 50 }
  },
  equipped: {},
  weaponSlots: [],
  sidearmSlots: [],
  skills: {},
  _nextId: 1000,
  _containerSpaces: {
    stash: { w: 10, h: 40, connected: true, grid: function(){var g=[];for(var r=0;r<40;r++){g[r]=[];for(var c=0;c<10;c++)g[r][c]=null;}return g;}(), _spaceUid: 'sp_stash', _itemUid: 'itm_stash', _label: '储藏箱', _noLose: true },
  },
};

// ===== 容器 API（统一格子操作入口） =====
const C = {
  _d: G._containerSpaces,
  STASH: 'stash',
  bagOrder: ['chest_pack','clothes','legs','waist_pouch','pack','safe'],

  exists(id) { return !!this._d[id]; },
  get(id) { return this._d[id] || null; },
  grid(id) { var s = this._d[id]; return s ? s.grid : null; },
  getCell(id, r, c) { var g = this.grid(id); return g && g[r] ? g[r][c] : null; },
  setCell(id, r, c, v) { if (this._d[id] && this._d[id].grid[r]) this._d[id].grid[r][c] = v; },
  clearCell(id, r, c) { this.setCell(id, r, c, null); },
  isEmpty(id, r, c) { return this.getCell(id, r, c) == null; },
  rows(id) { var g = this.grid(id); return g ? g.length : 0; },
  cols(id) { var g = this.grid(id); return g && g[0] ? g[0].length : 0; },
  w(id) { var s = this._d[id]; return s ? s.w : 0; },
  h(id) { var s = this._d[id]; return s ? s.h : 0; },
  connected(id) { var s = this._d[id]; return s ? s.connected !== false : true; },
  cellGroup(id) { var s = this._d[id]; return s ? s.cellGroup : null; },
  getBanTags(id) { var s = this._d[id]; return s ? s._banTags : null; },
  cloneSpace(oldId, newId) { if (this._d[oldId]) this._d[newId] = this._d[oldId]; },
  assign(id, val) { this._d[id] = val; },
  delete(id) { delete this._d[id]; },

  each(fn) { for (var k in this._d) { fn(k, this._d[k]); } },

  // 网格遍历：对区域内每个格子执行 fn
  eachCell(id, r0, c0, h, w, fn) {
    for (var r = r0; r < r0 + h; r++)
      for (var c = c0; c < c0 + w; c++)
        fn(r, c, this.getCell(id, r, c));
  },

  // 放置物品到格子（不处理容器初始化，仅填格）
  _occupy(id, item, row, col) {
    var sz = getItemSize(item);
    for (var r = 0; r < sz.h; r++)
      for (var c = 0; c < sz.w; c++)
        this.setCell(id, row + r, col + c, item);
  },

  // 从格子擦除物品
  _vacate(id, row, col) {
    var item = this.getCell(id, row, col);
    if (!item) return null;
    var sz = getItemSize(item);
    for (var r = 0; r < sz.h; r++)
      for (var c = 0; c < sz.w; c++)
        if (row + r >= 0 && col + c >= 0)
          this.clearCell(id, row + r, col + c);
    return item;
  },

  // 容器级写操作
  setBanTags(id, tags) { if (this._d[id]) this._d[id]._banTags = tags; },
  copy(fromId, toId) { if (this._d[fromId]) this._d[toId] = this._d[fromId]; },
};

// ===== 装备 API =====
const E = {
  _d: G.equipped,
  weapon: G.weaponSlots,
  sidearm: G.sidearmSlots,
  get(slot) { return this._d[slot]; },
  set(slot, item) { this._d[slot] = item; },
  clear(slot) { this._d[slot] = null; },
  each(fn) { for (var s in this._d) fn(s, this._d[s]); },
  reset() { this._d = G.equipped = {}; },
  clearWeapons() { this.weapon.length = 0; this.sidearm.length = 0; },
  clearWeapon() { this.weapon.length = 0; },
  clearSidearm() { this.sidearm.length = 0; },
};

// 物品数据（用唯一ID关联，不用引用比较）
const ITEMS = [
  { id: 'pk2', name: '伊比利亚航海置物皮包', x: 3, y: 3, cx: 5, cy: 3, _cellGroup: [[null,'B','B','B',null],['A','B','B','B','C'],['A','B','B','B','C']], tags: ['背包', '容器', '可装备'] },
  { id: 'pk3', name: '水手帆布挎包', x: 2, y: 2, cx: 2, cy: 3, tags: ['背包', '容器', '可装备'] },
  { id: 'coin_gold', name: '金币', stack: 1000, tags: ['可堆叠', '货币'] },
  { id: 'coin_silver', name: '银币', stack: 1000, tags: ['可堆叠', '货币'] },
  { id: 'blood_bag_s', name: '兽皮注射器', x: 1, y: 1, durability: 100, heal: 30, tags: ['医用品', '消耗品'] },
  { id: 'rusty_knife', name: '生锈水手短匕', x: 1, y: 2, tags: ['武器', '短刀', '单手', '可装备'] },
  { id: 'broken_chest', name: '破损轻骑兵胸甲', x: 3, y: 3, durability: 30, tags: ['护甲', '胸甲', '耐久物品', '可装备'] },
  { id: 'jewelry_safe', name: '首饰保险盒', x: 2, y: 2, cx: 2, cy: 2, tags: ['保险箱', '容器', '可装备'] },
  { id: 'cloth_coarse', name: '粗布上衣', x: 3, y: 3, cx: 2, cy: 1, connected: false, tags: ['上衣', '容器', '可装备'] },
  { id: 'stash_default', name: '10x40储藏箱', cx: 10, cy: 40, tags: ['储藏箱', '容器'] },
  { id: 'x6y7', name: 'X6Y7', x: 6, y: 7, tags: ['测试'] },
  { id: 'x4y4', name: 'X4Y4', x: 4, y: 4, tags: ['测试'] },
  { id: 'x5', name: 'X5', x: 5, y: 5, tags: ['测试'] },
];


// === 物品像素图标系统 ===
// 商人头像使用 100×100，物品图标使用 48×48（d 字段的行数决定分辨率）



// 获取物品尺寸
function getItemSize(item) {
  if (!item) return { w: 1, h: 1 };
  if (item.x != null && item.y != null) return { w: item.x, h: item.y };
  if (item.size) return { w: item.size.w || 1, h: item.size.h || 1 };
  return { w: 1, h: 1 };
}

// 查找物品的类型
function hasTag(item, tag) {
  return item && item.tags && item.tags.indexOf(tag) !== -1;
}

// 查找物品的最大耐久（从模板读取）
function getItemMaxDurability(item) {
  if (!item || !item.id) return null;
  if (item._maxDur != null) return item._maxDur;
  for (var _i = 0; _i < ITEMS.length; _i++) {
    if (ITEMS[_i].id === item.id && ITEMS[_i].durability != null) {
      item._maxDur = ITEMS[_i].durability;
      return item._maxDur;
    }
  }
    return null;
}

// 计算属性

// 找空槽位
// 装备槽单一数据源
// 增删装备槽只需改此数组，findSlot / isValidEquip / renderEquip / CSS / getBagUnlocked 自动同步
// ===== 装备系统 =====
var SLOT_DEFS = [
  { key:'head',       label:'头',     tag:'头盔',   el:'eqHead',         exEl:'exEqHead',         cls:'s-head',       row:1, col:2, bagUnlock:null },
  { key:'sling',      label:'背带',   tag:'背带',   el:'eqSling',        exEl:'exEqSling',        cls:'s-sling',      row:1, col:3, bagUnlock:null, _protected:true },
  { key:'mask',       label:'面具',   tag:'面具',   el:'eqMask',         exEl:'exEqMask',         cls:'s-mask',       row:1, col:1, bagUnlock:null },
  { key:'arms',       label:'手臂',   tag:'臂甲',   el:'eqArms',         exEl:'exEqArms',         cls:'s-arms',       row:2, col:1, bagUnlock:null },
  { key:'safe',       label:'保险箱', tag:'保险箱', el:'eqSafe',         exEl:'exEqSafe',         cls:'s-safe',       row:4, col:1, bagUnlock:'safe', _protected:true },
  { key:'chest',      label:'胸',     tag:'胸甲',   el:'eqChest',        exEl:'exEqChest',        cls:'s-chest',      row:2, col:2, bagUnlock:null },
  { key:'clothes',    label:'衣服',   tag:'上衣',   el:'eqClothes',      exEl:'exEqClothes',      cls:'s-clothes',    row:2, col:3, bagUnlock:null, _protected:true },
  { key:'legs',       label:'腿',     tag:'腿甲',   el:'eqLegs',         exEl:'exEqLegs',         cls:'s-legs',       row:4, col:2, bagUnlock:null, _protected:true },
  { key:'pants',      label:'裤子',   tag:'裤子',   el:'eqPants',        exEl:'exEqPants',        cls:'s-pants',      row:4, col:3, bagUnlock:null },
  { key:'pack',       label:'背包',   tag:'背包',   el:'eqPack',         exEl:'exEqPack',         cls:'s-pack',       row:2, col:4, bagUnlock:'backpack' },
  { key:'chest_pack', label:'胸包',   tag:'胸包',   el:'eqChestPack',    exEl:'exEqChestPack',    cls:'s-chest-pack', row:1, col:4, bagUnlock:'satchel' },
  { key:'waist_pouch',label:'腰包',   tag:'腰包',   el:'eqWaistPouch',   exEl:'exEqWaistPouch',   cls:'s-waist-pouch',row:4, col:4, bagUnlock:'waist' },
  { key:'camp_stash', label:'营地设施', tag:'储藏箱', el:'eqCampStash',    exEl:null,                cls:'s-camp-stash',  row:1, col:1, bagUnlock:null },
];

// 生成装备栏 grid CSS 规则
(function() {
  var css = '';
  for (var i = 0; i < SLOT_DEFS.length; i++) {
    var d = SLOT_DEFS[i];
    css += '.' + d.cls + ' { grid-column: ' + d.col + '; grid-row: ' + d.row + '; }\n';
  }
  var style = document.createElement('style');
  style.id = 'slotGridStyle';
  style.textContent = css;
  document.head.appendChild(style);
})();

function findSlot(item) {
  if (!item) return null;
  // 武器/单手是动态多槽，特殊处理
  if (hasTag(item, '武器') && hasTag(item, '可装备')) {
    var i = E.weapon.indexOf(null);
    return i >= 0 ? 'wslot_'+i : null;
  }
  if (hasTag(item, '单手') && hasTag(item, '可装备')) {
    var i = E.sidearm.indexOf(null);
    return i >= 0 ? 'sslot_'+i : null;
  }
  // 常规槽位遍历 SLOT_DEFS
  for (var i = 0; i < SLOT_DEFS.length; i++) {
    if (hasTag(item, SLOT_DEFS[i].tag) && hasTag(item, '可装备')) return SLOT_DEFS[i].key;
  }
  return null;
}

function renderEquip() {
  for (var i = 0; i < SLOT_DEFS.length; i++) {
    var d = SLOT_DEFS[i];
    var item = E.get(d.key);
    renderEquipSlot(d.el, d.key, item);
    renderEquipSlot(d.exEl, d.key, item);
  }
}

function renderEquipSlot(elId, slot, item) {
  const el = document.getElementById(elId);
  if (!el) return;
  const parent = el.parentElement;
  if (item) {
    el.textContent = item.name;
    parent.classList.remove('empty');
    parent.setAttribute('draggable', 'true');
    parent.setAttribute('data-drag', JSON.stringify({src:'equipped', slot: slot}));
    parent.setAttribute('style', 'background-image:url(\'' + _getItemIconUrl(item.id) + '\');background-size:contain;background-repeat:no-repeat;background-position:center;image-rendering:pixelated;');
    let ex = parent.querySelector('.ex');
    if (!ex) { ex = document.createElement('span'); ex.className = 'ex'; parent.appendChild(ex); }
    ex.textContent = ['atk','def','spd'].filter(k => item[k]).map(k => ({atk:'攻+',def:'防+',spd:'速'})[k] + item[k]).join(' ');
  } else {
    el.textContent = '空';
    parent.classList.add('empty');
    parent.removeAttribute('draggable');
    parent.removeAttribute('data-drag');
    parent.removeAttribute('style');
    const ex = parent.querySelector('.ex');
    if (ex) ex.remove();
  }
}

// 渲染背包（4种袋，网格系统）
function renderInventory() {
  renderInvGrid('invGrid');
  renderInvGrid('exInvGrid');
}

function getBagUnlocked(bag) {
  for (var i = 0; i < SLOT_DEFS.length; i++) {
    if (SLOT_DEFS[i].bagUnlock === bag) return !!E.get(SLOT_DEFS[i].key);
  }
  return true;
}

function isCellEmpty(bag, row, col) {
  var g = C.grid(bag);
  if (!g) return false;
  if (row < 0 || row >= g.length || col < 0 || col >= g[0].length) return false;
  return g[row][col] === null;
}

function getCellGroup(bag, row, col) {
  var cg = C.cellGroup(bag);
  if (cg && cg[row] !== undefined) return cg[row][col];
  return true;
}

// 将边框 CSS 字符串包裹为内层 div
// ===== 网格覆盖层 l1-l5 =====
function _layer(cls, css) { return '<div class="'+cls+'" style="position:absolute;inset:0;pointer-events:none;'+css+'"></div>'; }
// 第 1 层：格子背景
function _l1() { return _layer("l1", "background:rgba(60,60,60,0.3);"); }
// 第 2 层：死格背景
function _l2(blocked) { return blocked ? _layer("l2", "background:#0a0a0a;") : ""; }

// 第 3 层：统一浅灰网格线 1px（每格 right+bottom，首行 top，首列 left）
function _l3(r, c) {
  var s = 'border-right:1px solid #555;border-bottom:1px solid #555;';
  if (r === 0) s += 'border-top:1px solid #555;';
  if (c === 0) s += 'border-left:1px solid #555;';
  return _layer("l3", s);
}
// 第 4 层：不连通边界深黑 2px（cellGroup 不同或 null）
function _l4(bg, r, c, h, w, cg) {
  var bi = cellBorderInfo(bg, r, c, h, w, cg);
  var s = '';
  if (bi.rightPx === '2px' && bi.rightColor === '#000') s += 'border-right:2px solid #000;';
  if (bi.bottomPx === '2px' && bi.bottomColor === '#000') s += 'border-bottom:2px solid #000;';
  if (bi.topPx === '2px' && bi.topColor === '#000' && r > 0) s += 'border-top:2px solid #000;';
  if (bi.leftPx === '2px' && bi.leftColor === '#000' && c > 0) s += 'border-left:2px solid #000;';
  return s ? _layer("l4", s) : "";
}
// 第 5 层：空间外框深黑 2px（bag 的最外层边缘）
function _l5(r, c, h, w) {
  var s = '';
  if (r === 0) s += 'border-top:2px solid #000;';
  if (c === 0) s += 'border-left:2px solid #000;';
  if (r === h - 1) s += 'border-bottom:2px solid #000;';

// 格子边框信息：返回 {rightColor, bottomColor, rightPx, bottomPx, bg}
// 获取格子边框颜色和粗细
function cellBorderInfo(bagName, r, c, h, w, optCellGroup) {
  var data = bagName ? C.get(bagName) : null;
  var cellGroup = (optCellGroup !== undefined) ? optCellGroup : (data ? data.cellGroup : null);
  var connected = data ? data.connected !== false : true;
  var light = '#555', dark = '#000';
  var g = cellGroup ? (cellGroup[r] != null ? cellGroup[r][c] : null) : (bagName ? getCellGroup(bagName, r, c) : true);
  if (g == null) {
    var _tpNull = (r > 0) ? '0' : '2px';
    var _lpNull = (c > 0) ? '0' : '2px';
    return { rightColor: dark, bottomColor: dark, rightPx: '2px', bottomPx: '2px', topColor: dark, topPx: _tpNull, leftColor: dark, leftPx: _lpNull, bg: '#0d0d0d' };
  }
  var rightColor = dark, rightPx = '2px', bottomColor = dark, bottomPx = '2px';
  var topColor = dark, topPx = '2px', leftColor = dark, leftPx = '2px';
  if (c < w - 1) {
    var rg = cellGroup ? (cellGroup[r] != null ? cellGroup[r][c+1] : null) : (bagName ? getCellGroup(bagName, r, c+1) : true);
    if (rg != null && g === rg && connected) { rightColor = light; rightPx = '1px'; }
  }
  if (r < h - 1) {
    var bg = cellGroup ? (cellGroup[r+1] != null ? cellGroup[r+1][c] : null) : (bagName ? getCellGroup(bagName, r+1, c) : true);
    if (bg != null && g === bg && connected) { bottomColor = light; bottomPx = '1px'; }
  }
  if (r > 0) topPx = '0';
  if (c > 0) leftPx = '0';
  return { rightColor, bottomColor, rightPx, bottomPx, topColor, topPx, leftColor, leftPx, bg: null };
}

// ===== 容器操作 =====
function findSpace(bag, w, h) {
  var data = C.get(bag);
  if (!data || !data.grid)   return null;
  for (var r = 0; r <= data.grid.length - h; r++) {
    for (var c = 0; c <= data.grid[r].length - w; c++) {
      var ok = true;
      var baseGroup = null;
      for (var dr = 0; dr < h && ok; dr++) {
        for (var dc = 0; dc < w && ok; dc++) {
          var thisGroup = getCellGroup(bag, r + dr, c + dc);
          if (baseGroup === null) baseGroup = thisGroup;
          if (thisGroup === null || thisGroup !== baseGroup || !isCellEmpty(bag, r + dr, c + dc)) ok = false;
        }
      }
      if (ok) return { row: r, col: c };
    }
  }
    return null;
}

function placeItem(bag, item, row, col) {
  item = Object.assign({}, item);
  if (hasTag(item, '容器')) {
    if (!C.exists(item._uid)) { initContainerGrid(item); }
    else if (hasTag(item, '保险箱') && !C.getBanTags(item._uid)) { C.setBanTags(item._uid, ['背包', '腰包', '胸包', '保险箱']); }
  }
  var sz = getItemSize(item);
  var data = C.get(bag);
  data.grid[row][col] = item;
  for (var dr = 0; dr < sz.h; dr++) {
    for (var dc = 0; dc < sz.w; dc++) {
      if (dr === 0 && dc === 0) continue;
      data.grid[row + dr][col + dc] = { _occ: true, _ar: row, _ac: col };
    }
  }
}

function removeItem(bag, row, col) {
  var data = C.get(bag);
  var item = data.grid[row][col];
  if (!item || item._occ)   return null;
  var sz = getItemSize(item);
  for (var dr = 0; dr < sz.h; dr++) {
    for (var dc = 0; dc < sz.w; dc++) {
      data.grid[row + dr][col + dc] = null;
    }
  }
  return item;
}

// 在容器内部空间中查找空位
function findContainerSpace(cont, w, h) {
  for (var r = 0; r <= cont.h - h; r++) {
    for (var c = 0; c <= cont.w - w; c++) {
      var ok = true, baseGroup = null;
      for (var dr = 0; dr < h && ok; dr++) {
        for (var dc = 0; dc < w && ok; dc++) {
          var tr = r + dr, tc = c + dc;
          var thisGroup = (cont.cellGroup && cont.cellGroup[tr] !== undefined) ? cont.cellGroup[tr][tc] : true;
          if (baseGroup === null) baseGroup = thisGroup;
          if (thisGroup === null || thisGroup !== baseGroup || cont.grid[tr][tc] !== null) ok = false;
        }
      }
      if (ok) return { row: r, col: c };
    }
  }
    return null;
}
function placeItemInCont(cont, item, row, col) {
  item = Object.assign({}, item);
  if (hasTag(item, '容器')) {
    if (!C.exists(item._uid)) { initContainerGrid(item); }
    else if (hasTag(item, '保险箱') && !C.getBanTags(item._uid)) { C.setBanTags(item._uid, ['背包', '腰包', '胸包', '保险箱']); }
  }
  var sz = getItemSize(item);
  cont.grid[row][col] = item;
  for (var dr = 0; dr < sz.h; dr++) {
    for (var dc = 0; dc < sz.w; dc++) {
      if (dr === 0 && dc === 0) continue;
      cont.grid[row + dr][col + dc] = { _occ: true, _ar: row, _ac: col };
    }
  }
}

function addToBag(item) {
  var sz = getItemSize(item);
  for (var i = 0; i < C.bagOrder.length; i++) {
    var bk = C.bagOrder[i];
    if (!getBagUnlocked(bk)) continue;
    var bd = C.get(bk);
    if (bd && bd.w === 0 && !hasTag(item, '容器')) continue;
    if (bd && bd.connected === false && (sz.w > 1 || sz.h > 1)) continue;
    var space = findSpace(bk, sz.w, sz.h);
    if (space) {
      placeItem(bk, item, space.row, space.col);
      return bk;
    }
  }
    return null;
}

      h += '<span class="bp-hp">' + limb.hp + '/' + limb.max + '</span></div>';
    });
    return h;
  }
  var el = document.getElementById('bodyModel');
  if (el) el.innerHTML = buildHtml('');
  var ex = document.getElementById('exBodyModel');
  if (ex) ex.innerHTML = buildHtml('ex');
}

function countStashCoins() {
  var gold = 0, silver = 0, visited = {};
  function scan(g) {
    for (var r = 0; r < g.length; r++) for (var c = 0; c < g[r].length; c++) {
      var it = g[r][c];
      if (!it || it._occ) continue;
      if (it.id === 'coin_gold') gold += it._qty || 1;
      if (it.id === 'coin_silver') silver += it._qty || 1;
      if ((it.cx||it.cy) && it._uid && !visited[it._uid]) {
        visited[it._uid] = true;
        if (!C.exists(it._uid)) initContainerGrid(it);
        var sp = C.get(it._uid);
        if (sp && sp.grid) scan(sp.grid);
      }
    }
  }
  var grid = C.get(C.STASH) && C.get(C.STASH).grid;
  if (grid) scan(grid);
  return { gold: gold, silver: silver };
}

function countItemInBags(id) {
  var total = 0;
  for (var k in C._d) {
    var grid = C.grid(k); if (!grid) continue;
    for (var r = 0; r < grid.length; r++) for (var c = 0; c < grid[r].length; c++) {
      var it = grid[r][c];
      if (it && !it._occ && it.id === id) total += it._qty || 1;
    }
  }
  return total;
}

function removeFromBags(id, qty) {
  var need = qty;
  for (var k in C._d) {
    var grid = C.grid(k); if (!grid) continue;
    for (var r = 0; r < grid.length && need > 0; r++) for (var c = 0; c < grid[r].length && need > 0; c++) {
      var it = grid[r][c];
      if (it && !it._occ && it.id === id) {
        if (it._qty) { if (it._qty <= need) { need -= it._qty; grid[r][c] = null; } else { it._qty -= need; need = 0; } }
        else { need--; grid[r][c] = null; }
      }
    }
  }
  return need === 0;
}

// 传递性容器包含检测：检查 targetUid 是否（直接/间接）存在于 containerUid 的内部空间中
function isItemInContainer(targetUid, containerUid) {
  var sp = C.get(containerUid);
  if (!sp) return false;
  for (var r = 0; r < sp.h; r++) {
    for (var c = 0; c < sp.w; c++) {

      if (cell && !cell._occ && cell._uid) {

        if (isItemInContainer(targetUid, cell._uid)) return true;

  }
  return false;
}

function equipItem(bag, row, col) {
  var data = C.get(bag);
  if (!data || !data.grid) return;
  var item = data.grid[row][col];
  if (!item) return;
  // 装备该物品时，关闭已打开的容器浮窗
  if (item._uid) {
    for (var _i = _openContainerModals.length - 1; _i >= 0; _i--) {
      if (_openContainerModals[_i].item._uid === item._uid) {
        closeContainerModal(_openContainerModals[_i].overlay);
        break;
      }
    }
  }
  if (hasTag(item, '武器')) {
    var slotIdx = E.weapon.indexOf(null);
    if (slotIdx >= 0) {
      E.weapon[slotIdx] = item;
      removeItem(bag, row, col);
      renderAll();
      showMsg('装备了 ' + item.name, 'suc');
      return;
    }
  }
  if (hasTag(item, '单手')) {
    var slotIdx = E.sidearm.indexOf(null);
    if (slotIdx >= 0) {
      E.sidearm[slotIdx] = item;
      removeItem(bag, row, col);
      renderAll();
      showMsg('装备了 ' + item.name, 'suc');
      return;
    }
  }
  showMsg('没有空的武器或单手槽', 'info');
  const slot = findSlot(item);
  if (!slot) { showMsg('不能装备该物品', 'info'); return; }
  const old = E.get(slot);
  if (old) {
    // 确保来源 bag（可能是 _cont_）的引用存在
    if (bag.indexOf('_cont_') === 0 && !C.exists(bag)) {
      var _reUid = parseInt(bag.substring(6), 10);
      if (C.get(_reUid)) C.assign(bag, C.get(_reUid));
    }
    var _oldSz = getItemSize(old);
    var _oldSpace = findSpace(bag, _oldSz.w, _oldSz.h);
    if (!_oldSpace) {
      return;
    }
    removeItem(bag, row, col);
    E.set(slot, item);
    placeItem(bag, old, _oldSpace.row, _oldSpace.col);
    if (C.exists(item._uid)) C.assign(slot, C.get(item._uid));
  } else {
    E.set(slot, item);
    removeItem(bag, row, col);
  }
  if (C.exists(item._uid)) C.assign(slot, C.get(item._uid));
  renderAll();
  showMsg('装备了 ' + item.name, 'suc');
}

// 卸下装备（优先存入储藏箱，再查背包，无空间则弹窗）
function unequip(slot) {
  const item = E.get(slot);
  if (!item) return;

  // 收集所有需要存放的物品（主物品 + 背带关联的武器）
  var items = [{ item: item }];
  if (slot === 'sling' && E.weapon) {
    E.weapon.forEach(function(w) { if (w) items.push({ item: w }); });
  }

  // 尝试存入储藏箱或背包
  for (var i = 0; i < items.length; i++) {
    var it = items[i].item;
    var itSz = getItemSize(it);
    items[i].placed = false;
    if (G._currentMap) {
      // 远征：仅查背包
      if (addToBag(it)) items[i].placed = true;
    } else {
      // 营地：先查储藏箱，再查背包
      var sp = findSpace(C.STASH, itSz.w, itSz.h);
      if (sp) {
        placeItem(C.STASH, it, sp.row, sp.col);
        items[i].placed = true;
      } else if (addToBag(it)) {
        items[i].placed = true;
      }
    }
  }

  var allPlaced = items.every(function(x) { return x.placed; });
  if (!allPlaced) {
    showMsg('无空间存放！', 'info');
    return;
  }

  // 全部存入成功后才清除装备位
  C.delete(slot);
  E.clear(slot);
  if (slot === 'sling' && E.weapon) {
    E.clearWeapon();
  }
  renderAll();
  showMsg(item.name + ' 已卸下', 'info');
}

  var placed = 0;

      if (hasTag(item, '容器')) initContainerGrid(item);

      if (space) {

        placed += item._qty;
        remaining -= item._qty;
      } else {
        if (placed === 0) showMsg('储藏箱已满！', 'info');
        break;
      }
    }
  } else {
    for (var i = 0; i < qty; i++) {

        break;
      }
    }
  }

  closeQtyModal();
  renderAll();
}

  var overlay = document.createElement('div');

  header.appendChild(title);

  var contentDiv = document.createElement('div');

  _openContainerModals.push({ overlay: overlay, item: item, bagName: bagName, contentDiv: contentDiv });

}

function closeContainerModal(overlay) {
  if (!overlay) {
    // 未指定参数：关闭全部
    for (var i = _openContainerModals.length - 1; i >= 0; i--) {
      var m = _openContainerModals[i];
      if (m.item._uid) C.delete('_cont_' + m.item._uid);
      m.overlay.remove();
    }
    _openContainerModals = [];
    return;
  }
  for (var i = 0; i < _openContainerModals.length; i++) {
    if (_openContainerModals[i].overlay === overlay) {
      if (_openContainerModals[i].item._uid) C.delete('_cont_' + _openContainerModals[i].item._uid);
      overlay.remove();
      _openContainerModals.splice(i, 1);
      break;
    }
  }
}

function enterMap(key) {
  var m = MAPS[key];
  if (!m) return;
  G._currentMap = key;
  G._actionTime = m.actionTime;
  G._cols = m.cols;
  G._rows = m.rows;
  G._playerCol = 0;
  G._playerRow = 0;
  // 生成网格
  G._grid = [];
  for (var r = 0; r < m.rows; r++) {
    G._grid[r] = [];
    for (var c = 0; c < m.cols; c++) {
      G._grid[r][c] = { explored: false };
    }
  }
  // 玩家出生在地图最外一圈的随机位置
  var spawnEdge = Math.floor(Math.random() * 4);
  var spawnRow, spawnCol;
  if (spawnEdge === 0) { spawnRow = 0; spawnCol = Math.floor(Math.random() * m.cols); }
  else if (spawnEdge === 1) { spawnRow = m.rows - 1; spawnCol = Math.floor(Math.random() * m.cols); }
  else if (spawnEdge === 2) { spawnRow = Math.floor(Math.random() * m.rows); spawnCol = 0; }
  else { spawnRow = Math.floor(Math.random() * m.rows); spawnCol = m.cols - 1; }
  G._playerRow = spawnRow;
  G._playerCol = spawnCol;
  G._grid[spawnRow][spawnCol] = { explored: true };
  // 撤离点为离出生点最远的两个角落
  var corners = [
    { row: 0, col: 0 },
    { row: 0, col: m.cols - 1 },
    { row: m.rows - 1, col: 0 },
    { row: m.rows - 1, col: m.cols - 1 }
  ];
  corners.sort(function(a, b) {
    var da = Math.abs(a.row - spawnRow) + Math.abs(a.col - spawnCol);
    var db = Math.abs(b.row - spawnRow) + Math.abs(b.col - spawnCol);
    return db - da;
  });
  // 在最近的两个最远角落附近设撤离点
  for (var ei = 0; ei < 2; ei++) {
    var er = Math.min(m.rows - 1, Math.max(0, corners[ei].row + (corners[ei].row === 0 ? Math.floor(Math.random() * 4) : -Math.floor(Math.random() * 4))));
    var ec = Math.min(m.cols - 1, Math.max(0, corners[ei].col + (corners[ei].col === 0 ? Math.floor(Math.random() * 4) : -Math.floor(Math.random() * 4))));
    if (er !== spawnRow || ec !== spawnCol) {
      G._grid[er][ec].type = 'extract';
    }
  }
  renderExpedition();
}

function renderExpedition() {
  // 远征中锁定装备/储藏箱/商人导航
  document.getElementById('navEquip').classList.add('disabled');

  document.getElementById('mapSelect').style.display = 'none';

  document.getElementById('dDesc').textContent = '';

}

function updateActionTimeDisplay() {
  document.getElementById('actionTimeDisplay').textContent = G._actionTime;
}

function renderDungeonGrid() {
  var grid = document.getElementById('roomGrid');
  if (!grid) return;
  // 坐标显示
  document.getElementById('coordDisplay').textContent = '当前位置：' + String.fromCharCode(65 + G._playerCol) + (G._playerRow + 1);
  // 列标签行
  var html = '<div style="display:inline-flex;flex-direction:column;gap:1px;">';
  // 表头（列字母）
  html += '<div style="display:flex;gap:1px;margin-left:30px;">';
  for (var c = 0; c < G._cols; c++) {
    html += '<div style="width:32px;text-align:center;font-size:8px;color:#555;">' + String.fromCharCode(65 + c) + '</div>';
  }
  html += '</div>';
  // 行
  for (var r = 0; r < G._rows; r++) {
    // 行号
    html += '<div style="display:flex;gap:1px;align-items:center;">';
    html += '<div style="width:28px;text-align:center;font-size:8px;color:#555;">' + (r + 1) + '</div>';
    for (var c = 0; c < G._cols; c++) {
      var cell = G._grid[r][c];
      var isPlayer = (r === G._playerRow && c === G._playerCol);
      var isExtract = cell.type === 'extract';
      var canMove = false;
      var bg = '#111';
      var border = '1px solid #222';
      if (isPlayer) {
        bg = '#4ecca3';
        border = '1px solid #4ecca3';
      } else if (isAdjacentToPlayer(r, c) && G._actionTime > 0) {
        canMove = true;
        if (isExtract) { bg = '#2a2a00'; border = '1px solid #e94560'; }
        else if (cell.explored) { bg = '#252525'; border = '1px solid #4ecca3'; }
        else { bg = '#0a0a1e'; border = '1px solid #0f3460'; }
      } else {
        if (isExtract) { bg = '#2a2a00'; border = '1px solid #e94560'; }
        else if (cell.explored) { bg = '#252525'; border = '1px solid #333'; }
        else { bg = '#111'; border = '1px solid #222'; }
      }
      var marker = '';
      if (isPlayer) marker = 'P';
      else if (isExtract) marker = 'E';
      html += '<div onclick="' + (canMove ? 'moveTo(' + c + ',' + r + ')' : '') + '" style="width:var(--cell-size);height:var(--cell-size);background:' + bg + ';border:' + border + ';;cursor:' + (canMove ? 'pointer' : 'default') + ';display:flex;align-items:center;justify-content:center;font-size:10px;color:' + (isPlayer ? '#000' : (isExtract ? '#e94560' : 'transparent')) + ';font-weight:bold;">' + marker + '</div>';
    }
    html += '</div>';
  }
  html += '</div>';
  // 图例
  html += '<div style="display:flex;gap:10px;margin-top:6px;font-size:10px;color:#888;justify-content:center;">';
  html += '<span><span style="display:inline-block;width:10px;height:10px;background:#4ecca3;;vertical-align:middle;"></span> 玩家</span>';
  html += '<span><span style="display:inline-block;width:10px;height:10px;background:#2a2a00;border:1px solid #e94560;;vertical-align:middle;"></span> 撤离点</span>';
  html += '<span><span style="display:inline-block;width:10px;height:10px;background:#0a0a1e;border:1px solid #0f3460;;vertical-align:middle;"></span> 可移动</span>';
  html += '<span><span style="display:inline-block;width:10px;height:10px;background:#111;border:1px solid #222;;vertical-align:middle;"></span> 未探索</span>';
  html += '</div>';
  grid.innerHTML = html;
}

function isAdjacentToPlayer(r, c) {
  var dr = Math.abs(r - G._playerRow);
  var dc = Math.abs(c - G._playerCol);
  return dr <= 1 && dc <= 1 && (dr + dc > 0);
}

function moveTo(col, row) {
  if (!isAdjacentToPlayer(row, col)) return;
  if (G._actionTime <= 0) return;
  G._actionTime -= 1;
  G._playerCol = col;
  G._playerRow = row;
  var cell = G._grid[row][col];
  cell.explored = true;
  updateActionTimeDisplay();

  if (cell.type === 'extract') {
    extract();
    return;
  }

  var log = '移动到 ' + String.fromCharCode(65 + col) + (row + 1);
  document.getElementById('dLog').textContent = log;
  renderGrid();

  if (G._actionTime <= 0) {
    lostInMap();
  }
}

function extract() {
  document.getElementById('dLog').textContent = '你成功撤离了海岸！';
  document.getElementById('dChoices').innerHTML = '<button class="pri" onclick="leaveMap()">返回营地</button>';
  document.getElementById('dDesc').textContent = '撤离成功';
}

function loseAllItems() {
  // 遍历所有空间，清空未标记为不丢失的物品
  C.each(function(k, sp) {
    if (sp._noLose) return;
    if (!sp.grid) return;
    for (var r = 0; r < sp.grid.length; r++) {
      for (var c = 0; c < (sp.grid[r] ? sp.grid[r].length : 0); c++) {
        sp.grid[r][c] = null;
      }
    }
  });
  // 清空装备栏（排除受保护的栏位），清理容器空间和关联背包
  for (var slot in E._d) {
    var _protectedSlot = false;
    for (var _ui = 0; _ui < SLOT_DEFS.length; _ui++) { if (SLOT_DEFS[_ui].key === slot && SLOT_DEFS[_ui]._protected) { _protectedSlot = true; break; } }
    if (_protectedSlot) continue;
    var item = E.get(slot);
    if (item && item._uid) {
      C.delete(item._uid);
      C.delete('_cont_' + item._uid);
    }
    E.clear(slot);
  }
  E.clearWeapons();
  E.sidearm = [];
}

function lostInMap() {
  loseAllItems();
  document.getElementById('dLog').textContent = '行动时间耗尽！你迷失了...\n丢失了装备和背包中的物品。';
  document.getElementById('dChoices').innerHTML = '<button class="pri" onclick="leaveMap()">返回营地</button>';
  document.getElementById('dDesc').textContent = '迷失';
}

function leaveMap() {
  delete G._currentMap;
  delete G._actionTime;
  delete G._cols;
  delete G._rows;
  delete G._playerCol;
  delete G._playerRow;
  delete G._grid;

var _saveMode = false, _selectedSlot = -1;
var SAVE_KEYS = [];

function getSlotInfo(idx) {
  var raw = localStorage.getItem(SAVE_KEYS[idx]);
  if (!raw) return null;
  try { var d = JSON.parse(raw); return { time: d._savetime || 0, label: new Date(d._savetime || Date.now()).toLocaleString() }; }

function renderSave() {

  info.className = 'msg ' + (_saveMode || _selectedSlot >= 0 ? 'suc' : 'info');
  var btn = document.getElementById('saveBtn');
  if (btn) btn.textContent = _saveMode ? '取消保存' : '保存游戏';

    if (sd) {
      div.innerHTML = '<span style="color:#aaa;flex:none;width:60px;">栏位' + (i+1) + '</span><span style="color:#888;font-size:10px;">' + sd.label + '</span>';

    }
    div.onclick = function(idx) { return function() { onSlotClick(idx); }; }(i);
    slots.appendChild(div);
  }
}

function toggleSaveMode() {
  _saveMode = !_saveMode;
  _selectedSlot = -1;
  renderSave();
}

function onSlotClick(idx) {
  if (_saveMode) {
    G._savetime = Date.now();
    localStorage.setItem(SAVE_KEYS[idx], JSON.stringify(G));
    _saveMode = false;
    _selectedSlot = -1;
    renderSave();
    showMsg('已保存到栏位 ' + (idx+1), 'suc');
    return;
  }
  _selectedSlot = idx;
  renderSave();

function doLoad() {
  if (_selectedSlot < 0) { showMsg('请先选中一个存档栏位', 'info'); return; }
  doLoadIdx(_selectedSlot);
  _selectedSlot = -1;
}

function doDelete() {
  if (_selectedSlot < 0) { showMsg('请先选中一个存档栏位', 'info'); return; }
  var sd = getSlotInfo(_selectedSlot);
  if (!sd) { showMsg('该栏位为空', 'info'); return; }
  showConfirmModal('确定删除栏位 ' + (_selectedSlot+1) + ' 的存档？', function() {
    localStorage.removeItem(SAVE_KEYS[_selectedSlot]);
    _selectedSlot = -1;
    renderSave();
    showMsg('存档已删除', 'info');
  });
}

function doLoadIdx(idx) {
  var raw = localStorage.getItem(SAVE_KEYS[idx]);
  if (!raw) { showMsg('该栏位为空', 'info'); return; }
  Object.assign(G, JSON.parse(raw));
  E._d = G.equipped; E.weapon = G.weaponSlots; E.sidearm = G.sidearmSlots; C._d = G._containerSpaces;
  migrateLimbs();
  migrateSave();
  normalizeBags();
  renderAll();
  _saveMode = false;
  showMsg('已读取栏位 ' + (idx+1), 'suc');
}

function normalizeBags() {
  // 收集所有当前背包中的物品（兼容旧格式）
  var items = [];
  C.bagOrder.forEach(function(b) {
    var bag = C.get(b);
    if (!bag) return;
    if (bag.grid) {
      bag.grid.forEach(function(row) { row.forEach(function(cell) { if (cell && !cell._occ) items.push(cell); }); });
    } else if (Array.isArray(bag)) {
      items = items.concat(bag);
    }
  });
  // 保存储藏箱网格
  var stashBackup = C.get(C.STASH) ? JSON.parse(JSON.stringify(C.get(C.STASH))) : null;
  // 旧格式迁移：G.stash 数组 → C.get(C.STASH) 网格
  if (!stashBackup && Array.isArray(G.stash)) {
    var g = []; for (var r = 0; r < 20; r++) { g[r] = []; for (var c = 0; c < 20; c++) g[r][c] = null; }
    stashBackup = { w: 20, h: 20, connected: true, grid: g };
    G.stash.forEach(function(item) {
      if (!item) return;
      var sz = getItemSize(item);
      for (var r = 0; r <= 20 - sz.h && sz.w <= 20; r++) {
        for (var c = 0; c <= 20 - sz.w; c++) {
          var ok = true;
          for (var dr = 0; dr < sz.h && ok; dr++) {
            for (var dc = 0; dc < sz.w && ok; dc++) {
              if (g[r + dr][c + dc] !== null) ok = false;
            }
          }
          if (ok) {
            g[r][c] = Object.assign({}, item);
            for (var dr = 0; dr < sz.h; dr++) {
              for (var dc = 0; dc < sz.w; dc++) {
                if (dr !== 0 || dc !== 0) g[r + dr][c + dc] = { _occ: true, _ar: r, _ac: c };
              }
            }
            r = 999; break;
          }
        }
      }
    });
  }
  delete G.stash;
  // 重置预定义空间（不影响动态 _cont_uid 等条目）
  C._d.satchel = { w: 0, h: 0, connected: true, grid: [], _spaceId: 'satchel' };
  C._d.waist = { w: 0, h: 0, connected: true, grid: [], _spaceId: 'waist' };
  C._d.backpack = { w: 0, h: 0, connected: true, grid: [], _spaceId: 'backpack' };
  C._d.safe = { w: 0, h: 0, connected: true, grid: [], _spaceId: 'safe' };
  // 恢复储藏箱
  if (stashBackup) C._d.stash = stashBackup;
  // 重新放入物品
  items.forEach(function(item) {
    // 迁移旧格式 size → x/y
    if (item.size && (item.x == null || item.y == null)) {
      item.x = item.size.w;
      item.y = item.size.h;
      delete item.size;
    }
    var sz = getItemSize(item);
    for (var bi = 0; bi < ['pockets','satchel','waist','backpack','safe'].length; bi++) {
      var bn = ['pockets','satchel','waist','backpack','safe'][bi];
      var data = C.get(bn);
      if (data && data.connected === false && (sz.w > 1 || sz.h > 1)) continue;
      for (var r = 0; r <= data.grid.length - sz.h; r++) {
        for (var c = 0; c <= data.grid[r].length - sz.w; c++) {
          var ok = true;
          var baseGroup = null;
          for (var dr = 0; dr < sz.h && ok; dr++) {
            for (var dc = 0; dc < sz.w && ok; dc++) {
              var thisGroup = getCellGroup(bn, r + dr, c + dc);

document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
document.addEventListener('mousedown', function(e) {
  if (e.button !== 2) return;
  e.preventDefault();
  if (_isDragging) return;
  // 非拖拽：右键立即打开物品详情
  document.querySelectorAll('.l10').forEach(function(l){l.style.display='none';}); _selectedEl = null;
  var el = e.target.closest('[data-drag]'); if (!el) return;
  var d = el.getAttribute('data-drag'); if (!d) return;
  closeModal(); var src;
  try { src = JSON.parse(d); } catch(ee) { return; }
  if (src.src === 'bag') { var _ri = C.getCell(src.bag, src.row, src.col); if (_ri && hasTag(_ri, '储藏箱')) return; showGridItemModal(src.bag, src.row, src.col); }
  else if (src.src === 'equipped') { var _ri = E.get(src.slot); if (_ri && hasTag(_ri, '储藏箱')) return; showEquipModal(src.slot); }
  else if (src.src === 'weaponSlot') showWeaponSlotModal(src.idx);
  else if (src.src === 'sidearmSlot') showSidearmSlotModal(src.idx);
  else if (src.src === 'merchant') switchMerchant(src.merchant);
});

// R 键旋转
document.addEventListener('keydown', function(e) {
  if (!_isDragging) return;
  if (e.code === 'KeyR' || e.key === 'r' || e.key === 'R') { _dragRotateWrapper(); e.preventDefault(); }
});

function _dragRotateWrapper() {
  if (!_dragOrigSize) return;
  dragRotate();
  if (_dragOverlay) {
    _dragOverlay.style.width = _dragSize.w * CELL_SIZE + 'px';
    _dragOverlay.style.height = _dragSize.h * CELL_SIZE + 'px';
    _dragOverlay.style.left = (_lastMX - _dragSize.w * HALF_CELL) + 'px';
    _dragOverlay.style.top = (_lastMY - _dragSize.h * HALF_CELL) + 'px';
    var _icon = _dragOverlay.firstChild;
    _icon.style.transform = _dragRotated ? 'rotate(90deg)' : '';
  }
}

function _cancelDrag() {
  if (_dragOverlay) { _dragOverlay.style.display = 'none'; _dragOverlay = null; }
  // 恢复原位物品显示
  _dragSourceEls.forEach(function(s) { s.style.opacity = ''; s.style.visibility = ''; s.style.display = ''; if (s._origBgColor) { s.style.backgroundColor = s._origBgColor; delete s._origBgColor; } else { s.style.backgroundColor = ''; } if (s._origBg) { s.style.backgroundImage = s._origBg; delete s._origBg; } if (s._origOutline) { s.style.outline = s._origOutline; delete s._origOutline; } });
  _dragSourceEls = [];
  if (_dragL11 && _dragL11.length) { _dragL11.forEach(function(el) { if (el.parentNode) el.parentNode.removeChild(el); }); _dragL11 = []; }
  _dragItem = null; _dragSrc = null; _dragSize = {w:1,h:1}; _dragHL = []; _dragRotated = false; _dragOrigSize = null; _dragGrabOffset = null; _dragOrigGrabOffset = null; _isDragging = false; _dragPotential = false; _dragStartTarget = null; _dragPotentialSrc = null;
  document.querySelectorAll('.drag-over, .drag-invalid, .drag-equip-valid').forEach(function(el) { el.classList.remove('drag-over', 'drag-invalid', 'drag-equip-valid'); });
  if (_dragL13 && _dragL13.length) {
    _dragL13.forEach(function(el) { if (el.parentNode) el.parentNode.removeChild(el); }); _dragL13 = [];
  }
}

// 左键单击选中，双击打开容器
var _clickTimer = null, _clickSrc = null, _selectedEl = null;
document.addEventListener('click', function(e) {
    var el = e.target.closest('[data-drag]');
  if (!el) {
    document.querySelectorAll('.l10').forEach(function(l){l.style.display='none';});
    _selectedEl = null;
    if (_clickTimer) { clearTimeout(_clickTimer); _clickTimer = null; _clickSrc = null; }
    return;
  }
  var d = el.getAttribute('data-drag');
  if (!d) return;
  var src;
  try { src = JSON.parse(d); } catch(ee) { return; }
  var item = resolveDragItem(src);
  if (!item || item._occ) return;
  // 阻止内联 onclick（右键已接管二级菜单）
  e.stopPropagation();
  e.preventDefault();
  // 选中：用 overlay 选择器精准匹配
  document.querySelectorAll('.l10').forEach(function(l){l.style.display='none';});
  var overlay = null;
  if (src.src === 'bag') {
    var _active = document.querySelector('.screen.active');
    if (_active) overlay = _active.querySelector('[data-overlay-for="' + src.bag + '-' + src.row + '-' + src.col + '"]');
    if (!overlay) overlay = document.querySelector('[data-overlay-for="' + src.bag + '-' + src.row + '-' + src.col + '"]');
  }
  if(overlay){var s=overlay.querySelector('.l10');if(s)s.style.display='block';}
  _selectedEl = overlay || el;
  // 容器物品：双击检测打开
  if (hasTag(item, '容器')) {
    if (_clickTimer && _clickSrc) {
      var same = false;
      if (src.src === 'bag' && _clickSrc.src === 'bag') same = _clickSrc.bag === src.bag && _clickSrc.row === src.row && _clickSrc.col === src.col;
      else if (src.src === 'equipped' && _clickSrc.src === 'equipped') same = _clickSrc.slot === src.slot;
      else if (src.src === 'weaponSlot' && _clickSrc.src === 'weaponSlot') same = _clickSrc.idx === src.idx;
      if (same) {
        clearTimeout(_clickTimer); _clickTimer = null; _clickSrc = null;
        closeModal();
        if (src.src === 'bag') _sel = { row: src.row, col: src.col, source: src.bag };
        else if (src.src === 'equipped') _sel = { slot: src.slot, source: 'equipped' };
        else if (src.src === 'weaponSlot') _sel = { idx: src.idx, source: 'weaponSlot' };
        itemOpen();
        return;
      }
    }
    if (_clickTimer) { clearTimeout(_clickTimer); _clickTimer = null; _clickSrc = null; }
    _clickSrc = src;
    _clickTimer = setTimeout(function() { _clickTimer = null; _clickSrc = null; }, 300);
  }
}, true);

function applyDragRotation(item) {
  if (_dragRotated && item) {
    item = Object.assign({}, item);
    var t = item.x;
    item.x = item.y;
    item.y = t;
  }
  return item;
}

// 当鼠标位置放不下多格物品时，搜索附近可放置的位置
function findSnapPosition(db, dr, dc, sz, opts) {
  // 按奇偶生成搜序：奇数从中心向外，偶数从左上角开始
  function _order(n) {
    var a = [];
    if (n % 2) { var m = Math.floor(n / 2); a.push(m);
      for (var i = 1; i <= m; i++) { a.push(m + i); a.push(m - i); }
    } else { for (var i = 0; i < n; i++) a.push(i); }
    return a;
  }
  var roffs = _order(sz.h), coffs = _order(sz.w);
  for (var ri = 0; ri < roffs.length; ri++) {
    for (var ci = 0; ci < coffs.length; ci++) {
      var anchorR = dr - roffs[ri], anchorC = dc - coffs[ci];
      var valid = true, baseGroup = null;
      for (var r = 0; r < sz.h && valid; r++) {
        for (var c = 0; c < sz.w && valid; c++) {
          var tr = anchorR + r, tc = anchorC + c;
          var thisGroup = getCellGroup(db, tr, tc);
          if (baseGroup === null) baseGroup = thisGroup;
          if (thisGroup === null || thisGroup !== baseGroup) { valid = false; break; }
          if (opts && opts.skipBag === db &&
              tr >= opts.skipRow && tr < opts.skipRow + opts.skipH &&
              tc >= opts.skipCol && tc < opts.skipCol + opts.skipW) continue;
          if (!isCellEmpty(db, tr, tc)) valid = false;
        }
      }
      if (valid) return {row: anchorR, col: anchorC};
    }
  }
    return null;
}

function handleMerchantDrop(merchantKey, row, col) {
  var data = _merchantGrids[merchantKey];
  if (!data || !data.grid) return;
  var cell = data.grid[row][col];
  if (!cell || !cell._template) return;
  var tpl = cell._template;
  var sz = getItemSize(tpl);
  var space = findTradeSpace(_tradeBuyGrid, sz.w, sz.h);
  if (!space) return;
  for (var r = 0; r < sz.h; r++) for (var c = 0; c < sz.w; c++) _tradeBuyGrid[space.row+r][space.col+c] = { _occ: true, _ar: space.row, _ac: space.col };
  _tradeBuyGrid[space.row][space.col] = Object.assign({}, tpl);
}
