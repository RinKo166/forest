<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOREST</title>
<style>
/* 手机强制横屏提示 */
@media (orientation: portrait) and (max-width: 768px) {
  #rotateTip { display: flex !important; }
  .container { display: none !important; }
}
</style>
<style>
:root {
  --cell-size: 50px;
  --scale: 1;
  --fs: calc(11px * var(--scale));
  --double-cell: calc(var(--cell-size) * 2);
  --container-cols: 11;
  --container-rows: 21;
  --container-width: calc(var(--cell-size) * var(--container-cols));
  --container-height: calc(var(--cell-size) * var(--container-rows));
}
@media (max-width: 1199px) { :root { --cell-size: 40px; } }
@media (max-width: 767px) { :root { --cell-size: 30px; } }
@media (max-width: 479px) { :root { --cell-size: 25px; } }
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
html, body { margin:0; padding:0; height:100%; overflow:hidden; width:100vw; }
body {
  background: #1a1a1a;
  color: #e0e0e0;
  font-family: 'Segoe UI', sans-serif; font-size: var(--fs);
  display: flex;
  flex-direction: column;
}
.container {
  width: 100vw;
  height: 100vh;
  max-width: 100vw;
  max-height: 100vh;
  overflow: hidden;
  background: #222;
  display: flex; flex-direction: column;
}
.top-bar {
  display: flex; align-items: center; gap: 20px;
  padding: 10px 16px;
  border-bottom: 1px solid #3a3a3a;
  flex-shrink: 0;
}
.top-bar h1 { font-size: 20px; color: #e94560; flex-shrink: 0; margin: 0; }

/* 导航 */
.nav-bar { display: flex; gap: 2px; flex-wrap: wrap; flex: 1; }
.nav-btn {
  padding: 6px 14px; background: transparent; border: none; color: #666;
  cursor: pointer; font-size: 13px; font-weight: bold;
  ;
}
.nav-btn:hover { color: #aaa; }
.nav-btn.active { color: #e94560; border-bottom-color: #e94560; }
.nav-btn.disabled { color: #444 !important; cursor: default !important; border-bottom-color: transparent !important; }
.nav-btn.disabled:hover { color: #444 !important; }
.sub-tab-bar { display:flex; gap:4px; margin-bottom:8px; flex-wrap:wrap; }
.sub-tab { width:var(--double-cell); height:var(--double-cell); padding:0; background:transparent; border:2px solid #444; ; cursor:pointer; position:relative; overflow:hidden; }
.sub-tab:hover { border-color:#888; background:rgba(255,255,255,0.05); }
.sub-tab.active { border-color:#e94560; background:rgba(233,69,96,0.1); }
.battle-log {
  background: #111; border: 1px solid #333; ;
  padding: 12px; min-height: 60px; overflow-y: auto;
  font-size: 13px; line-height: 1.6; white-space: pre-wrap;
  max-height: 50vh;
}

/* 界面容器 */
.content-area {
  flex: 1; overflow: hidden; border: 1px solid #3a3a3a; border-width: 0 1px 1px 1px; min-height:0;
}
.screen { display: none; height:100%; overflow-y:auto; padding: 16px; box-sizing:border-box; }
.screen.active { display: block; }

/* 装备界面 */
.equip-layout { display: flex; gap: 16px; flex-wrap: wrap; }

.stats-box {
  flex: none;
  background: #252525; ; padding: 14px;
  border: 1px solid #3a3a3a;
}
.stats-box .st { display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; border-bottom: 1px solid #222; }
.stats-box .st:last-child { border-bottom: none; }
.stats-box .v { font-weight: bold; color: #fff; }

.body-model {
  display: grid;
  grid-template-columns: var(--double-cell) var(--double-cell) var(--double-cell);
  gap: 3px;
  text-align: center;
  justify-content: center;
}
.body-part {
  cursor: default;
  transition: background 0.2s;
  width: var(--double-cell); height: var(--double-cell);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
.body-part .bp-name { color: rgba(255,255,255,0.8); font-size: 11px; }
.body-part .bp-hp { color: #fff; font-weight: bold; font-size: 14px; }
.equip-box { flex: none; display: flex; flex-direction: column; align-items: center; background:#252525; border:1px solid #3a3a3a; ; padding:14px; }
.equip-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr 1fr;
  grid-template-rows: auto auto auto auto;
  gap: 5px;
}
.equip-slot {
  background: #252525; border: 2px solid #3a3a3a;
  padding: 6px; text-align: center;
  width: var(--double-cell); height: var(--double-cell);
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  cursor: pointer; font-size: 12px;
}
.equip-slot:hover { border-color: #e94560; }
.equip-slot.empty { border-style: solid; opacity: 0.5; }
.equip-slot .sl { font-size: 10px; color: #666; }
.equip-slot .nm { font-weight: bold; color: #fff; font-size: 12px; }
.equip-slot .ex { font-size: 10px; color: #aaa; }
.equip-slot.drag-equip-valid { border-color: #4ecca3; }

/* .s-* grid positions generated from SLOT_DEFS at init */

.ws-row { display:none; gap:5px; margin-top:5px; justify-content:center; flex-wrap:wrap; width:100%; }
.ws-row .equip-slot { width:var(--double-cell); height:var(--double-cell); }

.inv-box { flex: 1.5; min-width: 170px; max-width:100%; background: #252525; ; padding: 14px; border: 1px solid #3a3a3a; }
.inv-box h2 { font-size: 14px; color: #888; margin-bottom: 8px; text-align: center; }
.stash-panel { background: #252525; ; padding: 14px; border: 1px solid #3a3a3a; max-width:100%; }
.inv-grid { display: grid; grid-template-columns: 1fr; gap: 0; }
[data-drop="buybox"].drag-over { outline: 1px solid #4ecca3 !important; outline-offset: -1px; background: #1a3a2e !important; }
.inv-item {
  background: #222; border: 1px solid #333; ;
  padding: 6px; text-align: center; cursor: pointer; font-size: 11px;
}
/* .grid-item hover removed */
.inv-item .in { font-weight: bold; color: #fff; }
.inv-item .is { color: #888; font-size: 10px; }
.inv-empty { grid-column: 1/-1; text-align: center; color: #555; padding: 20px; }
.inv-cell { width:var(--cell-size); height:var(--cell-size); box-sizing:border-box; background:#2a2a2a; }
[data-drop="bag"].grid-item { ; border:none; min-width:0; padding:0; text-align:left; box-sizing:border-box; position:relative; z-index:0; }
[data-drop^="bag"] { background:#2a2a2a; position:relative; }
.l1 { display:block; }
.l2 { display:block; }
.l3 { z-index:0; } .l4 { z-index:1; } .l5 { z-index:2; }
.l3 { z-index:0; } .l4 { z-index:1; } .l5 { z-index:2; }
.l7 { display:flex; }
.l8 { display:block; }
.l9 { display:block; }
.l10 { display:block; }
.l11 { display:block; }
.inv-cell.inv-blocked { cursor:default; }
.inv-cell.drag-over, [data-drop="bag"].grid-item.drag-over { background:rgba(26,58,46,0.7) !important; outline:none !important; z-index:2; }
.inv-cell.drag-over, [data-drop="bag"].grid-item.drag-over { background:rgba(26,58,46,0.7) !important; outline:none !important; z-index:2; }
.inv-cell.drag-invalid, [data-drop="bag"].grid-item.drag-invalid { background:rgba(58,26,26,0.7) !important; outline:none !important; z-index:2; }
.inv-cell.drag-invalid, [data-drop="bag"].grid-item.drag-invalid { background:rgba(58,26,26,0.7) !important; outline:none !important; z-index:2; }
[data-overlay-for].drag-over { background: rgba(26,58,46,0.7) !important; outline: none !important; z-index: 2; }
[data-overlay-for].drag-over { background: rgba(26,58,46,0.7) !important; outline: none !important; z-index: 2; }
[data-overlay-for].drag-invalid { background: rgba(58,26,26,0.7) !important; outline: none !important; z-index: 2; }
[data-overlay-for].drag-invalid { background: rgba(58,26,26,0.7) !important; outline: none !important; z-index: 2; }
.equip-slot.drag-over { border-color: #4ecca3 !important; background: #1a3a2e !important; }
.equip-slot.drag-over { border-color: #4ecca3 !important; background: #1a3a2e !important; }
.equip-slot.drag-invalid { border-color: #e94560 !important; background: #3a1a1a !important; }
.body-part.drag-over { outline: 2px solid #4ecca3 !important; outline-offset: -1px; background: #1a3a2e !important; }
.body-part.drag-invalid { outline: 2px solid #e94560 !important; outline-offset: -1px; background: #3a1a1a !important; }
[data-txt] {  }
.inv-item-name-wrap { overflow: hidden; width: 100%; white-space: nowrap; text-overflow: ellipsis; text-align: left; }

/* 弹窗 */
.btn-pri { background:#3a5a4a; color:#e0e0e0; } .btn-pri:hover { background:#4a7a5a; } .btn-pri:active { background:#2a4a3a; }
.btn-suc { background:#2a4a3a; color:#e0e0e0; } .btn-suc:hover { background:#3a6a4a; } .btn-suc:active { background:#1a3a2a; }
.btn-del { background:#3a2a2a; color:#e06060; } .btn-del:hover { background:#5a3a3a; } .btn-del:active { background:#2a1a1a; }
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  z-index: 1000;
  pointer-events: none;
}
.modal-box {
  background: #252525; border: 2px solid #3a3a3a; ;
  padding: 18px; min-width: 260px; max-width: 90vw; max-height: 90vh; overflow-y: auto; pointer-events: auto;
}
.modal-box .sub {
  font-size: 13px; color: #aaa; margin-bottom: 12px; line-height: 1.5;
}
.modal-header {
  display: flex; justify-content: space-between; align-items: center;
  position: sticky; top: 0; z-index: 1;
  background: #252525; padding-bottom: 8px; margin-bottom: 8px;
}
.mbtn {
  display: block; width: 100%; padding: 10px; margin-bottom: 6px;
  border: 1px solid #fff; ; background: #222; color: #fff;
  font-size: 13px; cursor: pointer; font-family: inherit;
}
.mbtn:hover { border-color: #4ecca3; background: #353535; }
.mbtn:last-child { margin-bottom: 0; }
.mbtn-del { border-color: #e94560; color: #e94560; }

@media (max-width: 700px) {
  .equip-layout { flex-direction: column; }
  .equip-grid { grid-template-columns: 1fr 1fr 1fr 1fr; }
  .equip-slot { min-height: 48px; }
}
</style>
</head>
<body>
<div id="rotateTip" style="display:none;position:fixed;inset:0;z-index:99999;background:#1a1a1a;color:#888;flex-direction:column;align-items:center;justify-content:center;font-size:18px;gap:12px;">
  <div style="font-size:48px;">↻</div>
  <div>请横屏使用</div>
  <button onclick="document.documentElement.requestFullscreen?.();screen.orientation?.lock?.('landscape').catch(()=>{});this.style.display='none'" style="margin-top:16px;padding:14px 32px;font-size:16px;background:#3a5a4a;color:#e0e0e0;border:none;cursor:pointer;">全屏并横屏</button>
</div>
<div class="container">
  <div class="top-bar">
    <h1>FOREST</h1>
    <div class="nav-bar">
      <button class="nav-btn active" id="navDungeon" onclick="showScreen('dungeon')">远征</button>
      <button class="nav-btn" id="navEquip" onclick="showScreen('equip')">角色</button>
      <button class="nav-btn" id="navCamp" onclick="showScreen('camp')">营地</button>
      <button class="nav-btn" id="navSkill" onclick="showScreen('skill')">技能</button>
      <button class="nav-btn" id="navTrader" onclick="showScreen('trader')">商人</button>
      <button class="nav-btn" id="navStats" onclick="showScreen('stats')">航海日志</button>
      <button class="nav-btn" id="navSave" onclick="showScreen('save')">存档</button>
    </div>
  </div>
  <div class="content-area">

  <!-- 远征界面 -->
  <div class="screen active" id="screenDungeon">
    <div id="mapSelect" style="text-align:center;padding:10px;">
      <div style="font-size:16px;color:#e94560;font-weight:bold;margin-bottom:12px;">选择地图</div>
      <div id="mapList"></div>
    </div>
    <div id="expeditionView" style="display:none;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
        <span class="title" id="dTitle" style="font-size:16px;">远征</span>
        <span style="font-size:14px;">行动时间：<span id="actionTimeDisplay" style="color:#4ecca3;font-weight:bold;">100</span></span>
      </div>
      <!-- 上排：地图左 + 事件右 -->
      <div style="display:flex;gap:10px;min-height:0;">
        <div style="flex:1;min-width:0;">
          <div style="text-align:left;font-size:11px;color:#888;margin-bottom:4px;" id="coordDisplay">当前位置：A1</div>
          <div id="roomGrid" style="overflow:auto;max-height:60vh;"></div>
        </div>
        <div style="width:260px;flex-shrink:0;display:flex;flex-direction:column;">
          <div class="desc" id="dDesc" style="margin-bottom:6px;"></div>
          <div class="battle-log" id="dLog" style="flex:1;"></div>
          <div class="choices" id="dChoices" style="margin-top:6px;"></div>
        </div>
      </div>
      <!-- 远征页装备同步 -->
      <div style="border-top:2px solid #3a3a3a;margin-top:12px;padding-top:10px;">
        <div style="font-size:14px;color:#888;text-align:center;margin-bottom:10px;">── 装备 ──</div>
        <div class="equip-layout">
          <div class="stats-box">
            <div class="body-model" id="exBodyModel"></div>
          </div>
          <div class="equip-box">
            <div class="equip-grid">
              <div class="equip-slot s-head empty" data-drop="equip" data-slot="head" onclick="showEquipModal('head')"><span class="sl">头</span><span class="nm" id="exEqHead">空</span></div>
              <div class="equip-slot s-sling empty" data-drop="equip" data-slot="sling" onclick="showEquipModal('sling')"><span class="sl">背带</span><span class="nm" id="exEqSling">空</span></div>
              <div class="equip-slot s-mask empty" data-drop="equip" data-slot="mask" onclick="showEquipModal('mask')"><span class="sl">面具</span><span class="nm" id="exEqMask">空</span></div>
              <div class="equip-slot s-arms empty" data-drop="equip" data-slot="arms" onclick="showEquipModal('arms')"><span class="sl">手臂</span><span class="nm" id="exEqArms">空</span></div>
              <div class="equip-slot s-safe empty" data-drop="equip" data-slot="safe" onclick="showEquipModal('safe')"><span class="sl">保险箱</span><span class="nm" id="exEqSafe">空</span></div>
              <div class="equip-slot s-chest empty" data-drop="equip" data-slot="chest" onclick="showEquipModal('chest')"><span class="sl">胸</span><span class="nm" id="exEqChest">空</span></div>
              <div class="equip-slot s-clothes empty" data-drop="equip" data-slot="clothes" onclick="showEquipModal('clothes')"><span class="sl">衣服</span><span class="nm" id="exEqClothes">空</span></div>
              <div class="equip-slot s-legs empty" data-drop="equip" data-slot="legs" onclick="showEquipModal('legs')"><span class="sl">腿</span><span class="nm" id="exEqLegs">空</span></div>
              <div class="equip-slot s-pants empty" data-drop="equip" data-slot="pants" onclick="showEquipModal('pants')"><span class="sl">裤子</span><span class="nm" id="exEqPants">空</span></div>
              <div class="equip-slot s-pack empty" data-drop="equip" data-slot="pack" onclick="showEquipModal('pack')"><span class="sl">背包</span><span class="nm" id="exEqPack">空</span></div>
              <div class="equip-slot s-chest-pack empty" data-drop="equip" data-slot="chest_pack" onclick="showEquipModal('chest_pack')"><span class="sl">胸包</span><span class="nm" id="exEqChestPack">空</span></div>
              <div class="equip-slot s-waist-pouch empty" data-drop="equip" data-slot="waist_pouch" onclick="showEquipModal('waist_pouch')"><span class="sl">腰包</span><span class="nm" id="exEqWaistPouch">空</span></div>
            </div>
            <div class="ws-row" id="exWeaponSlotsRow"></div>
            <div class="ws-row" id="exSidearmSlotsRow"></div>
            <div class="actions">
              <button class="btn btn-pri" onclick="showItemOverview()">物品总览</button>
              <button class="btn btn-sec" onclick="damageAllLimbs(10)" style="margin-left:6px;">测试伤害</button>
            </div>
            <div class="msg info" id="exEquipMsg"></div>
          </div>
          <div class="inv-box">
            <div class="inv-grid" id="exInvGrid"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 营地界面 -->
  <div class="screen" id="screenEquip">
    <div style="display:flex;flex-wrap:wrap;gap:16px;min-height:0;align-items:flex-start;">
      <div style="display:flex;flex-direction:column;gap:12px;">
        <div class="stats-box" style="flex:none;">
          <div class="body-model" id="bodyModel"></div>
        </div>
        <div class="equip-box" style="flex:none;">
          <div class="equip-grid">
            <div class="equip-slot s-head empty" data-drop="equip" data-slot="head" onclick="showEquipModal('head')"><span class="sl">头</span><span class="nm" id="eqHead">空</span></div>
            <div class="equip-slot s-sling empty" data-drop="equip" data-slot="sling" onclick="showEquipModal('sling')"><span class="sl">背带</span><span class="nm" id="eqSling">空</span></div>
            <div class="equip-slot s-mask empty" data-drop="equip" data-slot="mask" onclick="showEquipModal('mask')"><span class="sl">面具</span><span class="nm" id="eqMask">空</span></div>
            <div class="equip-slot s-arms empty" data-drop="equip" data-slot="arms" onclick="showEquipModal('arms')"><span class="sl">手臂</span><span class="nm" id="eqArms">空</span></div>
            <div class="equip-slot s-safe empty" data-drop="equip" data-slot="safe" onclick="showEquipModal('safe')"><span class="sl">保险箱</span><span class="nm" id="eqSafe">空</span></div>
            <div class="equip-slot s-chest empty" data-drop="equip" data-slot="chest" onclick="showEquipModal('chest')"><span class="sl">胸</span><span class="nm" id="eqChest">空</span></div>
            <div class="equip-slot s-clothes empty" data-drop="equip" data-slot="clothes" onclick="showEquipModal('clothes')"><span class="sl">衣服</span><span class="nm" id="eqClothes">空</span></div>
            <div class="equip-slot s-legs empty" data-drop="equip" data-slot="legs" onclick="showEquipModal('legs')"><span class="sl">腿</span><span class="nm" id="eqLegs">空</span></div>
            <div class="equip-slot s-pants empty" data-drop="equip" data-slot="pants" onclick="showEquipModal('pants')"><span class="sl">裤子</span><span class="nm" id="eqPants">空</span></div>
            <div class="equip-slot s-pack empty" data-drop="equip" data-slot="pack" onclick="showEquipModal('pack')"><span class="sl">背包</span><span class="nm" id="eqPack">空</span></div>
            <div class="equip-slot s-chest-pack empty" data-drop="equip" data-slot="chest_pack" onclick="showEquipModal('chest_pack')"><span class="sl">胸包</span><span class="nm" id="eqChestPack">空</span></div>
            <div class="equip-slot s-waist-pouch empty" data-drop="equip" data-slot="waist_pouch" onclick="showEquipModal('waist_pouch')"><span class="sl">腰包</span><span class="nm" id="eqWaistPouch">空</span></div>
          </div>
          <div class="ws-row" id="weaponSlotsRow"></div>
          <div class="ws-row" id="sidearmSlotsRow"></div>
          <div class="actions">
            <button class="btn btn-pri" onclick="showItemOverview()">物品总览</button>
            <button class="btn btn-sec" onclick="damageAllLimbs(10)" style="margin-left:6px;">测试伤害</button>
          </div>
          <div class="msg info" id="equipMsg"></div>
        </div>
      </div>
      <div class="inv-box" style="width:var(--container-width);height:var(--container-height);flex:none;overflow-y:auto;">
        <div class="inv-grid" id="invGrid"></div>
      </div>
      <div class="stash-panel" style="width:var(--container-width);height:var(--container-height);flex:none;overflow-y:auto;">
        <div class="inv-grid" id="stashGrid" style="grid-template-columns:repeat(10,var(--cell-size));gap:0;;"></div>
              </div>
    </div>
  </div>
  <!-- 统计界面 -->
  <div class="screen" id="screenStats">
    <div class="stats-box-big">
      <div class="l">航海日志</div>
      <div class="d">
        <div>最深远征：第 <span id="stFloor" style="color:#fff;">1</span> 次</div>
        <div>击退敌人：<span id="stKills" style="color:#fff;">0</span></div>
        <div>累计掠夺：<span id="stGoldAll" style="color:#fff;">0</span></div>
        <div>阵亡次数：<span id="stDeaths" style="color:#e94560;">0</span></div>
      </div>
      <div style="margin-top:20px;text-align:left;">
        <div class="l" style="font-size:14px;">敌人图鉴</div>
        <div id="bestiaryList" style="margin-top:8px;"></div>
      </div>
    </div>
  </div>

  <!-- 营地界面 -->
  <div class="screen" id="screenCamp">
    <div style="padding:16px;">
      <div class="l" style="margin-bottom:8px;">营地设施</div>
      <div class="equip-slot s-stash empty" id="campStashSlot" data-drop="equip" data-slot="camp_stash" onclick="showEquipModal('camp_stash')" style="width:var(--double-cell,100px);height:var(--double-cell,100px);">
        <span class="sl">设施</span>
        <span class="nm" id="eqCampStash">空</span>
      </div>
    </div>
  </div>

  <!-- 技能界面 -->
  <div class="screen" id="screenSkill">
    <div class="stats-box-big">
      <div class="l">技能</div>
      <div class="d" id="skillList">
        <div style="color:#666;font-size:13px;">暂无技能</div>
      </div>
    </div>

function _calcIconDisp(iconSize, containerPx) {
  if (containerPx >= iconSize) {
    return Math.floor(containerPx / iconSize) * iconSize;
  }
  var div = 2;
  var dst = iconSize;
  while (dst > containerPx && div <= iconSize) {
    dst = Math.floor(iconSize / div);
    div++;
  }
  return dst > containerPx ? containerPx : dst;
}

function _getItemIconUrl(itemId) {
  if (_pixelIconCache[itemId]) return _pixelIconCache[itemId];
  var def = ITEM_ICONS[itemId];
  var rows = def ? def.d.split('|') : null;
  var s = rows ? rows.length : 48;
  var c = document.createElement('canvas');
  c.width = s; c.height = s;
  var ctx = c.getContext('2d');
  if (def && rows) {
    var cellS = s / rows.length;
    var minR = rows.length, maxR = 0, minC = rows[0].length / 2, maxC = 0;
    for (var r = 0; r < rows.length; r++) {
      var w = rows[r].length / 2; for (var col = 0; col < w; col++) {
        if (parseInt(rows[r].substr(col * 2, 2), 10) > 0) {
          if (r < minR) minR = r; if (r > maxR) maxR = r;
          if (col < minC) minC = col; if (col > maxC) maxC = col;
        }
      }
    }
    var spanR = maxR - minR + 1;
    var spanC = maxC - minC + 1;
    if (spanR > 0 && spanC > 0) {
      var maxFit = Math.floor((s - 2) / Math.max(spanC, spanR));
      cellS = Math.max(cellS, maxFit);
      if (cellS < 1) cellS = 1;
      var totalW = spanC * cellS;
      var totalH = spanR * cellS;
      var offX = Math.floor((s - totalW) / 2);
      var offY = Math.floor((s - totalH) / 2);
      for (var r = 0; r < rows.length; r++) {
        var w = rows[r].length / 2; for (var col = 0; col < w; col++) {
          var idx = parseInt(rows[r].substr(col * 2, 2), 10);
          if (idx > 0 && r >= minR && r <= maxR && col >= minC && col <= maxC) {
            ctx.fillStyle = def.p[idx - 1];
            ctx.fillRect(offX + (col - minC) * cellS, offY + (r - minR) * cellS, cellS, cellS);
          }
        }
      }
    }
  } else {
    var hash = 0;
    for (var i = 0; i < itemId.length; i++) hash = ((hash << 5) - hash) + itemId.charCodeAt(i);
    var hue = Math.abs(hash) % 360;
    ctx.fillStyle = 'hsl(' + hue + ',40%,30%)';

    ctx.fillRect(4, 4, s - 8, s - 8);
    ctx.fillStyle = 'hsl(' + hue + ',35%,40%)';
    ctx.fillRect(8, 8, s - 16, s - 16);
  }

var CELL_SIZE = 50, HALF_CELL = 25;
function getCellSize() {
  var mw = window.innerWidth, mh = window.innerHeight;
  // 基于视口宽高计算合适的格子尺寸
  var byW = Math.floor((mw - 40) / 28);     // 左右面板共约 28 倍格子宽 + 间距
  var byH = Math.floor((mh - 80) / 22);     // 容器约 21-22 行 + 顶栏
  var s = Math.min(byW, byH, 50);
  return Math.max(s, 20);  // 最小 20px
}
function syncCellSize() {
  CELL_SIZE = getCellSize();
  HALF_CELL = CELL_SIZE / 2;
  document.documentElement.style.setProperty('--cell-size', CELL_SIZE + 'px');
  document.documentElement.style.setProperty('--scale', CELL_SIZE / 50);
  renderAll();
}

function findTradeSpace(grid, w, h) {
  for (var r = 0; r <= 10 - h; r++) {
    for (var c = 0; c <= 10 - w; c++) {
      var ok = true;
      for (var rr = 0; rr < h && ok; rr++) for (var cc = 0; cc < w && ok; cc++) { if (grid[r+rr][c+cc]) ok = false; }
      if (ok) return { row: r, col: c };
    }
  }
    return null;
}

function findTemplate(id) {
  for (var i = 0; i < ITEMS.length; i++) { if (ITEMS[i].id === id) return ITEMS[i]; }
    return null;
}

function findMerchantSpace(grid, w, h) {
  for (var r = 0; r <= 40 - h; r++) {
    for (var c = 0; c <= 10 - w; c++) {
      var ok = true;
      for (var dr = 0; dr < h && ok; dr++) for (var dc = 0; dc < w && ok; dc++) { if (grid[r+dr][c+dc] !== null) ok = false; }
      if (ok) return { row: r, col: c };
    }
  }
    return null;
}

function initMerchantGrids() {
  _merchantGrids = {};
  for (var key in MERCHANT_DEFS) {
    var def = MERCHANT_DEFS[key];
    var grid = [];
    for (var r = 0; r < 40; r++) { grid[r] = []; for (var c = 0; c < 10; c++) grid[r][c] = null; }
    for (var i = 0; i < def.items.length; i++) {
      var it = def.items[i];
      var tpl = findTemplate(it.id);
      if (!tpl) continue;
      var sz = getItemSize(tpl);
      var space = findMerchantSpace(grid, sz.w, sz.h);
      if (!space) continue;
      for (var r = 0; r < sz.h; r++) for (var c = 0; c < sz.w; c++) { grid[space.row+r][space.col+c] = { _occ: true, _ar: space.row, _ac: space.col }; }
      grid[space.row][space.col] = { id: it.id, price: it.price, currency: it.currency || '', _template: tpl, _ar: space.row, _ac: space.col };
    }
    _merchantGrids[key] = { name: def.name, grid: grid, _spaceId: 'merchant_'+key };
  }
}

function renderTradeBoxes() {
  // 检查 buy 框中的物品，根据 trades 计算需要付出的物品
  var def = MERCHANT_DEFS[_currentMerchant];
  _tradePayTotal = 0;
  var wantItems = []; // 收集需要付出的物品
  for (var r = 0; r < 10; r++) {
    for (var c = 0; c < 10; c++) {
      var item = _tradeBuyGrid[r][c];
      if (item && !item._occ) {
        // 查找匹配的 trade
        if (def && def.trades) {
          for (var i = 0; i < def.trades.length; i++) {
            if (def.trades[i].give.id === item.id) {
              var wt = findTemplate(def.trades[i].want.id);
              if (wt) wantItems.push({ tpl: wt, qty: def.trades[i].want.qty });
            }
          }
        }
      }
    }
  }
  // 填充 pay 框显示需要付出的物品
  for (var r = 0; r < 10; r++) for (var c = 0; c < 10; c++) _tradePayGrid[r][c] = null;
  for (var i = 0; i < wantItems.length; i++) {
    var wi = wantItems[i];
    var space = findTradeSpace(_tradePayGrid, wi.tpl.x||1, wi.tpl.y||1);
    if (space) {
      var o = Object.assign({}, wi.tpl); assignItemId(o); o._qty = wi.qty;
      _tradePayGrid[space.row][space.col] = o;
    }
  }
  // 按钮状态：检查玩家是否有需要付出的物品
  var canTrade = true;
  for (var i = 0; i < wantItems.length; i++) {
    if (countItemInBags(wantItems[i].tpl.id) < wantItems[i].qty) { canTrade = false; break; }
  }
  var warnEl = document.getElementById('tradeWarning');
  if (warnEl) {
    warnEl.style.visibility = (wantItems.length > 0 && !canTrade) ? 'visible' : 'hidden';
    warnEl.textContent = canTrade ? '' : '背包中缺少置换所需物品';
  }
  var btn = document.getElementById('tradeConfirmBtn');
  if (btn) { btn.disabled = !canTrade || wantItems.length === 0; btn.style.opacity = (!canTrade || wantItems.length === 0) ? '0.4' : '1'; }
  renderTradeGrid(_tradeBuyGrid, 'tradeBuyGrid');
  renderTradeGrid(_tradePayGrid, 'tradePayGrid');
}

function confirmTrade() {
  // 以物易物逻辑：检查 pay 框物品，从玩家背包扣除后给与 buy 框物品
  var giveItems = [];
  var wantItems = [];
  for (var r = 0; r < 10; r++) for (var c = 0; c < 10; c++) {
    var bi = _tradeBuyGrid[r][c];
    if (bi && !bi._occ) giveItems.push({ id: bi.id, qty: bi._qty || 1 });
    var pi = _tradePayGrid[r][c];
    if (pi && !pi._occ) wantItems.push({ id: pi.id, qty: pi._qty || 1 });
  }
  if (giveItems.length === 0) return;
  // 检查并扣除玩家背包中的 want 物品
  for (var i = 0; i < wantItems.length; i++) {
    if (!removeFromBags(wantItems[i].id, wantItems[i].qty)) {
      showMsg('背包中缺少所需物品', 'info'); return;
    }
  }
  // 给与 give 物品到玩家背包
  for (var i = 0; i < giveItems.length; i++) {
    var tpl = findTemplate(giveItems[i].id);
    if (!tpl) continue;
    for (var j = 0; j < giveItems[i].qty; j++) addToBag(Object.assign({}, tpl));
  }
  initTradeGrids();
  renderAll();
  showMsg('置换成功', 'ok');
}

function countStashCoins() {
  var gold = 0, silver = 0, visited = {};
  function scan(g) {
    for (var r = 0; r < g.length; r++) for (var c = 0; c < g[r].length; c++) {
      var it = g[r][c];
      if (!it || it._occ) continue;
      if (it.id === 'coin_gold') gold += it._qty || 1;
      if (it.id === 'coin_silver') silver += it._qty || 1;
      if ((it.cx||it.cy) && it._uid && !visited[it._uid]) {
        visited[it._uid] = true;
        if (!C.exists(it._uid)) initContainerGrid(it);
        var sp = C.get(it._uid);
        if (sp && sp.grid) scan(sp.grid);
      }
    }
  }
  var grid = C.get(C.STASH) && C.get(C.STASH).grid;
  if (grid) scan(grid);
  return { gold: gold, silver: silver };
}

function countItemInBags(id) {
  var total = 0;
  for (var k in C._d) {
    var grid = C.grid(k); if (!grid) continue;
    for (var r = 0; r < grid.length; r++) for (var c = 0; c < grid[r].length; c++) {
      var it = grid[r][c];
      if (it && !it._occ && it.id === id) total += it._qty || 1;
    }
  }
  return total;
}

function removeFromBags(id, qty) {
  var need = qty;
  for (var k in C._d) {
    var grid = C.grid(k); if (!grid) continue;

function unequip(slot) {
  const item = E.get(slot);
  if (!item) return;

  // 收集所有需要存放的物品（主物品 + 背带关联的武器）
  var items = [{ item: item }];

  // 尝试存入储藏箱或背包
  for (var i = 0; i < items.length; i++) {
    var it = items[i].item;
    var itSz = getItemSize(it);

    if (G._currentMap) {

function confirmTakeout() {

  if (!_qtySel) return;
  var template = ITEMS[_qtySel.idx];

  var qty = parseInt(document.getElementById('qtyInput').value, 10);
  if (isNaN(qty) || qty < 1) { showMsg('数量无效', 'info'); return; }

  var placed = 0;
  if (template.stack) {
    var remaining = qty;
    while (remaining > 0) {
      var item = Object.assign({}, template);
      assignItemId(item);
      item._qty = Math.min(remaining, template.stack);
      if (hasTag(item, '容器')) initContainerGrid(item);
      var sz = getItemSize(item);
      var space = findSpace(C.STASH, sz.w, sz.h);
      if (space) {
        placeItem(C.STASH, item, space.row, space.col);
        placed += item._qty;
        remaining -= item._qty;
      } else {
        if (placed === 0) showMsg('储藏箱已满！', 'info');
        break;
      }
    }
  } else {
    for (var i = 0; i < qty; i++) {
      var item = Object.assign({}, template);
      assignItemId(item);
      if (hasTag(item, '容器')) initContainerGrid(item);
      var sz = getItemSize(item);
      var space = findSpace(C.STASH, sz.w, sz.h);
      if (space) {
        placeItem(C.STASH, item, space.row, space.col);
        placed++;
      } else {
        if (i === 0) showMsg('储藏箱已满！', 'info');
        break;
      }
    }
  }

  if (placed > 0) showMsg('已存入储藏箱: ' + template.name + ' x' + placed, 'suc');
  closeQtyModal();
  renderAll();
}

function isBagSource(src) {
  return !!(C.grid(src));
}

function resolveDragItem(src) {
  if (src.src === 'bag') { return C.getCell(src.bag, src.row, src.col); }
  if (src.src === 'equipped') return E.get(src.slot);
  if (src.src === 'weaponSlot') return E.weapon[src.idx];
  if (src.src === 'sidearmSlot') return E.sidearm[src.idx];
    return null;
}

function isValidEquip(slot, item) {
  if (!item || !slot) return false;
  // 武器/单手多槽前缀匹配
  if (slot.indexOf('wslot_') === 0) return hasTag(item, '武器') && hasTag(item, '可装备');
  if (slot.indexOf('sslot_') === 0) return hasTag(item, '单手') && hasTag(item, '可装备');
  for (var i = 0; i < SLOT_DEFS.length; i++) {
    if (slot === SLOT_DEFS[i].key) return hasTag(item, SLOT_DEFS[i].tag) && hasTag(item, '可装备');
  }
  return false;
}

function itemAction() {
  if (!_sel) return;
  if (_sel.source === 'equipped') {
    unequip(_sel.slot);
  } else if (_sel.source === 'weaponSlot') {
    var wItem = E.weapon[_sel.idx];
    if (wItem) { addToBag(wItem); E.weapon[_sel.idx] = null; renderAll(); }
  } else if (_sel.source === 'sidearmSlot') {
    var sItem = E.sidearm[_sel.idx];
    if (sItem) { addToBag(sItem); E.sidearm[_sel.idx] = null; renderAll(); }
  } else if (isBagSource(_sel.source)) {
    var _item = C.getCell(_sel.source, _sel.row, _sel.col);
    if (_item && hasTag(_item, '医用品')) {
      useItem(_sel.source, _sel.row, _sel.col);
    } else {
      equipItem(_sel.source, _sel.row, _sel.col);
    }
  } else if (_sel.source === 'overview') {
    var _qTpl = ITEMS[_sel.idx];
    if (_qTpl && _qTpl.stack) {
      var _qIdx = _sel.idx;
      closeModal();
      showQuantityPicker(_qIdx);
    } else {
      var item = Object.assign({}, _qTpl); assignItemId(item); if (item.stack && !item._qty) item._qty = 1; if (hasTag(item, '容器')) initContainerGrid(item);
      var sz = getItemSize(item);
      var space = findSpace(C.STASH, sz.w, sz.h);
      if (space) { placeItem(C.STASH, item, space.row, space.col); showMsg('已存入储藏箱: ' + item.name, 'suc'); }
      else { showMsg('储藏箱已满！', 'info'); }
      closeModal();
      renderAll();
    }
    return;
  } else {
    showMsg('必须先取回背包才能装备', 'info');
  }
  closeModal();
}

function useItem(bag, row, col) {
  var data = C.get(bag);
  if (!data || !data.grid) return;
  var item = data.grid[row][col];
  if (!item) return;
  var healAmt = item.heal || 25;
  G.hp = Math.min(G.maxHp, G.hp + healAmt);
  showMsg('使用 ' + item.name + '，恢复 ' + healAmt + ' HP', 'suc');
  removeItem(bag, row, col);
  renderAll();
}

function itemTransfer() {
  if (!_sel) return;
  if (_sel.source === C.STASH) {
    var data = C.get(C.STASH);
    if (!data || !data.grid) return;
    var item = data.grid[_sel.row][_sel.col];
    if (!item) return;
    var bag = addToBag(item);
    if (bag) { removeItem(C.STASH, _sel.row, _sel.col); }
    else { showMsg('所有背包已满！', 'info'); }
  } else if (isBagSource(_sel.source)) {
    var data = C.get(_sel.source);
    if (!data || !data.grid) return;
    var item = data.grid[_sel.row][_sel.col];
    if (!item) return;
    removeItem(_sel.source, _sel.row, _sel.col);
    var sz = getItemSize(item);
    var space = findSpace(C.STASH, sz.w, sz.h);
    if (space) { placeItem(C.STASH, item, space.row, space.col); }
    else {
      placeItem(_sel.source, item, _sel.row, _sel.col);
      showMsg('储藏箱已满！', 'info');
      closeModal(); renderAll(); return;
    }
  }
  closeModal();
  renderAll();
}

function itemDestroy() {
  if (!_sel) return;
  var item;
  if (_sel.source === 'equipped') {
    item = E.get(_sel.slot);
    if (item) E.clear(_sel.slot);
  } else if (_sel.source === 'weaponSlot') {
    item = E.weapon[_sel.idx];
    if (item) E.weapon[_sel.idx] = null;
  } else if (isBagSource(_sel.source)) {

    if (!data || !data.grid) return;
    item = data.grid[_sel.row][_sel.col];
    if (item) removeItem(_sel.source, _sel.row, _sel.col);

  if (item) showMsg(item.name + ' 已销毁', 'info');
  closeModal();
  renderAll();
}

function assignItemId(item) {

  }
  return item._uid;
}

// 初始化容器物品的独立内部空间（通过ID注册表绑定）
function initContainerGrid(item) {
  assignItemId(item);
  if (C.exists(item._uid)) return;
  var w = item.cx != null ? item.cx : 5, h = item.cy != null ? item.cy : 3;
  var grid = [];
  for (var r = 0; r < h; r++) { grid[r] = []; for (var c = 0; c < w; c++) grid[r][c] = null; }
  var cellGroup = item._cellGroup;
  if (!cellGroup) {
    cellGroup = [];
    for (var r = 0; r < h; r++) { cellGroup[r] = []; for (var c = 0; c < w; c++) cellGroup[r][c] = 'A'; }
  }
  var _banTags = null;
  if (item.tags && item.tags.indexOf('保险箱') !== -1) _banTags = ['背包', '腰包', '胸包', '保险箱'];
  C.assign(item._uid, {
    w: w, h: h, grid: grid,
    cellGroup: cellGroup,
    connected: item.connected !== false,
    _spaceId: 'cont_' + item._uid,
    _banTags: _banTags
  });
}

function enterMap(key) {
  var m = MAPS[key];
  if (!m) return;
  G._currentMap = key;
  G._actionTime = m.actionTime;
  G._cols = m.cols;
  G._rows = m.rows;
  G._playerCol = 0;
  G._playerRow = 0;
  // 生成网格
  G._grid = [];
  for (var r = 0; r < m.rows; r++) {
    G._grid[r] = [];
    for (var c = 0; c < m.cols; c++) {
      G._grid[r][c] = { explored: false };
    }
  }
  // 玩家出生在地图最外一圈的随机位置
  var spawnEdge = Math.floor(Math.random() * 4);
  var spawnRow, spawnCol;
  if (spawnEdge === 0) { spawnRow = 0; spawnCol = Math.floor(Math.random() * m.cols); }
  else if (spawnEdge === 1) { spawnRow = m.rows - 1; spawnCol = Math.floor(Math.random() * m.cols); }
  else if (spawnEdge === 2) { spawnRow = Math.floor(Math.random() * m.rows); spawnCol = 0; }
  else { spawnRow = Math.floor(Math.random() * m.rows); spawnCol = m.cols - 1; }
  G._playerRow = spawnRow;
  G._playerCol = spawnCol;
  G._grid[spawnRow][spawnCol] = { explored: true };
  // 撤离点为离出生点最远的两个角落
  var corners = [
    { row: 0, col: 0 },
    { row: 0, col: m.cols - 1 },
    { row: m.rows - 1, col: 0 },
    { row: m.rows - 1, col: m.cols - 1 }
  ];
  corners.sort(function(a, b) {
    var da = Math.abs(a.row - spawnRow) + Math.abs(a.col - spawnCol);
    var db = Math.abs(b.row - spawnRow) + Math.abs(b.col - spawnCol);
    return db - da;
  });
  // 在最近的两个最远角落附近设撤离点
  for (var ei = 0; ei < 2; ei++) {
    var er = Math.min(m.rows - 1, Math.max(0, corners[ei].row + (corners[ei].row === 0 ? Math.floor(Math.random() * 4) : -Math.floor(Math.random() * 4))));
    var ec = Math.min(m.cols - 1, Math.max(0, corners[ei].col + (corners[ei].col === 0 ? Math.floor(Math.random() * 4) : -Math.floor(Math.random() * 4))));
    if (er !== spawnRow || ec !== spawnCol) {
      G._grid[er][ec].type = 'extract';
    }
  }
  renderExpedition();
}

function renderDungeonGrid() {
  var grid = document.getElementById('roomGrid');
  if (!grid) return;
  // 坐标显示
  document.getElementById('coordDisplay').textContent = '当前位置：' + String.fromCharCode(65 + G._playerCol) + (G._playerRow + 1);
  // 列标签行
  var html = '<div style="display:inline-flex;flex-direction:column;gap:1px;">';
  // 表头（列字母）
  html += '<div style="display:flex;gap:1px;margin-left:30px;">';
  for (var c = 0; c < G._cols; c++) {
    html += '<div style="width:32px;text-align:center;font-size:8px;color:#555;">' + String.fromCharCode(65 + c) + '</div>';
  }
  html += '</div>';
  // 行
  for (var r = 0; r < G._rows; r++) {
    // 行号
    html += '<div style="display:flex;gap:1px;align-items:center;">';
    html += '<div style="width:28px;text-align:center;font-size:8px;color:#555;">' + (r + 1) + '</div>';
    for (var c = 0; c < G._cols; c++) {
      var cell = G._grid[r][c];
      var isPlayer = (r === G._playerRow && c === G._playerCol);
      var isExtract = cell.type === 'extract';
      var canMove = false;
      var bg = '#111';
      var border = '1px solid #222';
      if (isPlayer) {
        bg = '#4ecca3';
        border = '1px solid #4ecca3';
      } else if (isAdjacentToPlayer(r, c) && G._actionTime > 0) {
        canMove = true;
        if (isExtract) { bg = '#2a2a00'; border = '1px solid #e94560'; }
        else if (cell.explored) { bg = '#252525'; border = '1px solid #4ecca3'; }
        else { bg = '#0a0a1e'; border = '1px solid #0f3460'; }
      } else {
        if (isExtract) { bg = '#2a2a00'; border = '1px solid #e94560'; }
        else if (cell.explored) { bg = '#252525'; border = '1px solid #333'; }
        else { bg = '#111'; border = '1px solid #222'; }
      }
      var marker = '';
      if (isPlayer) marker = 'P';
      else if (isExtract) marker = 'E';
      html += '<div onclick="' + (canMove ? 'moveTo(' + c + ',' + r + ')' : '') + '" style="width:var(--cell-size);height:var(--cell-size);background:' + bg + ';border:' + border + ';;cursor:' + (canMove ? 'pointer' : 'default') + ';display:flex;align-items:center;justify-content:center;font-size:10px;color:' + (isPlayer ? '#000' : (isExtract ? '#e94560' : 'transparent')) + ';font-weight:bold;">' + marker + '</div>';
    }
    html += '</div>';
  }
  html += '</div>';
  // 图例
  html += '<div style="display:flex;gap:10px;margin-top:6px;font-size:10px;color:#888;justify-content:center;">';
  html += '<span><span style="display:inline-block;width:10px;height:10px;background:#4ecca3;;vertical-align:middle;"></span> 玩家</span>';
  html += '<span><span style="display:inline-block;width:10px;height:10px;background:#2a2a00;border:1px solid #e94560;;vertical-align:middle;"></span> 撤离点</span>';
  html += '<span><span style="display:inline-block;width:10px;height:10px;background:#0a0a1e;border:1px solid #0f3460;;vertical-align:middle;"></span> 可移动</span>';
  html += '<span><span style="display:inline-block;width:10px;height:10px;background:#111;border:1px solid #222;;vertical-align:middle;"></span> 未探索</span>';
  html += '</div>';
  grid.innerHTML = html;
}

function isAdjacentToPlayer(r, c) {
  var dr = Math.abs(r - G._playerRow);
  var dc = Math.abs(c - G._playerCol);
  return dr <= 1 && dc <= 1 && (dr + dc > 0);
}

function moveTo(col, row) {
  if (!isAdjacentToPlayer(row, col)) return;
  if (G._actionTime <= 0) return;
  G._actionTime -= 1;
  G._playerCol = col;
  G._playerRow = row;
  var cell = G._grid[row][col];
  cell.explored = true;
  updateActionTimeDisplay();

  if (cell.type === 'extract') {

function loseAllItems() {
  // 遍历所有空间，清空未标记为不丢失的物品
  C.each(function(k, sp) {
    if (sp._noLose) return;
    if (!sp.grid) return;
    for (var r = 0; r < sp.grid.length; r++) {
      for (var c = 0; c < (sp.grid[r] ? sp.grid[r].length : 0); c++) {
        sp.grid[r][c] = null;
      }
    }
  });
  // 清空装备栏（排除受保护的栏位），清理容器空间和关联背包
  for (var slot in E._d) {
    var _protectedSlot = false;
    for (var _ui = 0; _ui < SLOT_DEFS.length; _ui++) { if (SLOT_DEFS[_ui].key === slot && SLOT_DEFS[_ui]._protected) { _protectedSlot = true; break; } }
    if (_protectedSlot) continue;
    var item = E.get(slot);
    if (item && item._uid) {
      C.delete(item._uid);
      C.delete('_cont_' + item._uid);
    }
    E.clear(slot);
  }
  E.clearWeapons();
  E.sidearm = [];
}

  loseAllItems();
  document.getElementById('dLog').textContent = '行动时间耗尽！你迷失了...\n丢失了装备和背包中的物品。';

      for (var r = 0; r <= data.grid.length - sz.h; r++) {
